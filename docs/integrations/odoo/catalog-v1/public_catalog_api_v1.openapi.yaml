openapi: 3.0.3
info:
  title: Ahan Asa Public Catalog API
  version: v1
  description: Read-only catalog projection API. No supplier or commercial offer data.
paths:
  /api/v1/catalog/products:
    get:
      parameters:
        - {name: locale, in: query, schema: {type: string, enum: [fa, en, ar], default: fa}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: q, in: query, schema: {type: string}}
        - {name: sku, in: query, schema: {type: string}}
        - {name: family, in: query, schema: {type: string}}
        - {name: group, in: query, schema: {type: string}}
        - {name: form, in: query, schema: {type: string}}
        - {name: grade, in: query, schema: {type: string}}
        - {name: standard, in: query, schema: {type: string}}
        - {name: commercial_size, in: query, schema: {type: string}}
        - {name: updated_since, in: query, schema: {type: string, format: date-time}}
      responses:
        '200': {description: Paginated active public catalog}
        '400': {description: Invalid parameter}
        '405': {description: Method not allowed}
  /api/v1/catalog/products/{product_variant_xid}:
    get:
      parameters:
        - {name: product_variant_xid, in: path, required: true, schema: {type: string}}
        - {name: locale, in: query, schema: {type: string, enum: [fa, en, ar], default: fa}}
      responses:
        '200': {description: Active public catalog product}
        '404': {description: Unknown or inactive product}
  /api/v1/catalog/meta:
    get:
      responses:
        '200': {description: Active filter metadata}
