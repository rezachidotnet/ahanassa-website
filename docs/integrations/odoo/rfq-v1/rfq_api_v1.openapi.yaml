openapi: 3.0.3
info:
  title: Ahan Asa Secure RFQ Intake API
  version: v1
paths:
  /api/v1/rfq:
    post:
      security: [{bearerAuth: []}]
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/RfqRequest'}}
      responses:
        '201': {description: RFQ created}
        '200': {description: Idempotent replay}
        '400': {description: Invalid payload}
        '401': {description: Unauthorized}
        '409': {description: Idempotency conflict}
        '413': {description: Payload too large}
        '415': {description: Unsupported media type}
        '500': {description: Generic server error}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  schemas:
    RfqRequest:
      type: object
      required: [customer, items]
      additionalProperties: false
      properties:
        locale: {type: string, enum: [fa, en, ar], default: fa}
        customer: {type: object, required: [name], additionalProperties: false}
        items: {type: array, minItems: 1, maxItems: 200}
        notes: {type: string, maxLength: 20000}
        consent: {type: object}
        source: {type: object}
