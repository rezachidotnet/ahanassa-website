# W30 domestic copy — staging.ahanassa.ir (staging release). Installed as /etc/nginx/sites-available/staging.ahanassa.ir.conf + sites-enabled symlink
# (RUNBOOK_P1.md §3). Reached only through ArvanCloud: the firewall admits 80/443 from Arvan's 14 IPv4 ranges only.
# Staging copy: activated by every staging publish, so the whole path runs before any production activation.
# Its pages send X-Robots-Tag: noindex, nofollow (the staging artifact's own _headers).
server {
    listen 80;
    server_name staging.ahanassa.ir;
    include /etc/nginx/snippets/ahanassa-acme.conf;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name staging.ahanassa.ir;
    ssl_certificate /etc/ahanassa/tls/staging.ahanassa.ir/fullchain.pem;
    ssl_certificate_key /etc/ahanassa/tls/staging.ahanassa.ir/privkey.pem;
    include /etc/nginx/snippets/ahanassa-tls.conf;
    include /etc/nginx/snippets/ahanassa-arvan-real-ip.conf;
    access_log /var/log/nginx/ahanassa-staging.access.log;
    error_log /var/log/nginx/ahanassa-staging.error.log warn;
    include /etc/nginx/snippets/ahanassa-static-staging.conf;
}
