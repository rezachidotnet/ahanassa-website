# W32 (W29 P2) — api-new.ahanassa.ir → the PRODUCTION domestic intake: the shadow API host on which P2 is proven; new.ahanassa.ir's form posts here (lib/mirror/iran-mirror.ts). Installed as /etc/nginx/sites-available/api-new.ahanassa.ir.conf + sites-enabled symlink (RUNBOOK_P2.md §3).
# Reached only through ArvanCloud (no Arvan cache: "bypass" for this host); the firewall admits 443 from Arvan only.
server {
    listen 80;
    server_name api-new.ahanassa.ir;
    include /etc/nginx/snippets/ahanassa-acme.conf;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api-new.ahanassa.ir;
    ssl_certificate /etc/ahanassa/tls/api-new.ahanassa.ir/fullchain.pem;
    ssl_certificate_key /etc/ahanassa/tls/api-new.ahanassa.ir/privkey.pem;
    include /etc/nginx/snippets/ahanassa-tls.conf;
    include /etc/nginx/snippets/ahanassa-arvan-real-ip.conf;
    access_log /var/log/nginx/ahanassa-rfq-production.access.log ahanassa_api;
    error_log /var/log/nginx/ahanassa-rfq-production.error.log warn;
    include /etc/nginx/snippets/ahanassa-rfq-proxy-production.conf;
}
