# W30 domestic copy — new.ahanassa.ir (production release). Installed as /etc/nginx/sites-available/new.ahanassa.ir.conf + sites-enabled symlink
# (RUNBOOK_P1.md §3). Reached only through ArvanCloud: the firewall admits 80/443 from Arvan's 14 IPv4 ranges only.
# P1 shadow host: the production release, proven here (parity test, MCI phone) before www.ahanassa.ir moves.
server {
    listen 80;
    server_name new.ahanassa.ir;
    include /etc/nginx/snippets/ahanassa-acme.conf;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name new.ahanassa.ir;
    ssl_certificate /etc/ahanassa/tls/new.ahanassa.ir/fullchain.pem;
    ssl_certificate_key /etc/ahanassa/tls/new.ahanassa.ir/privkey.pem;
    include /etc/nginx/snippets/ahanassa-tls.conf;
    include /etc/nginx/snippets/ahanassa-arvan-real-ip.conf;
    access_log /var/log/nginx/ahanassa-production.access.log;
    error_log /var/log/nginx/ahanassa-production.error.log warn;
    include /etc/nginx/snippets/ahanassa-static-production.conf;
}
