# W30 — any Host this server does not serve: no answer (no TLS handshake on 443, connection closed on 80). Replaces
# Ubuntu's `default` site (RUNBOOK_P1.md §3 removes sites-enabled/default).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
