# W32 (W29 P2 §3.4) — http-level pieces of the domestic RFQ intake's API hosts (sites/api-*.ahanassa.ir.conf).
#
# Client IP: the API sites include snippets/ahanassa-arvan-real-ip.conf, so $remote_addr is Arvan's X-Real-IP (trusted
# from the 14 Arvan ranges only; the firewall admits nothing else on 443). It is passed to Node as
# X-Ahanassa-Client-IP — the only client-IP header Node reads, and only from 127.0.0.1.

# 20 requests / min per client on POST /api/rfqs*, burst 10 (Arvan's WAF rule and Node's own limiter sit around it).
limit_req_zone $binary_remote_addr zone=ahanassa_rfq:10m rate=20r/m;
# File PUTs: a visitor sends up to 5 right after the submit — their own zone (Node keys them apart too: `files:`).
limit_req_zone $binary_remote_addr zone=ahanassa_rfq_files:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=ahanassa_rfq_admin:1m rate=30r/m;
# W35: ALTCHA challenges (GET, cheap to sign). A visitor fetches one per form view / retry / expiry.
limit_req_zone $binary_remote_addr zone=ahanassa_rfq_captcha:10m rate=30r/m;
limit_req_status 429;

# Access logs of the API hosts keep a truncated address (/24, IPv6 /48), the path WITHOUT the query string, the status
# and the size — never a body, header or full IP (W29 §3.5). 14 days (logrotate, RUNBOOK_P2.md §3).
map $remote_addr $ahanassa_ip_trunc {
    ~^(?P<a>\d+\.\d+\.\d+)\.\d+$ $a.0/24;
    ~^(?P<b>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*): $b::/48;
    default -;
}
log_format ahanassa_api '$time_iso8601 $ahanassa_ip_trunc "$request_method $uri" $status $body_bytes_sent $request_time';
