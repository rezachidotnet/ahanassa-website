# W30 domestic copy — http-level settings shared by every ahanassa site on iransrv (installed as
# /etc/nginx/conf.d/ahanassa-common.conf). deploy/iran/RUNBOOK_P1.md §3.
# The redirect / Cache-Control maps carry one key per hashed chunk (long paths).
map_hash_bucket_size 256;
map_hash_max_size 65536;

# MIME types the artifact uses that Ubuntu 26.04's mime.types does not name (it has avif, m3u8; nginx warns on a
# duplicate). The exact Content-Type of every path is pinned
# against www.ahanassa.com by the parity test (scripts/iran/parity.ts), not assumed here.
types {
    text/markdown                 md;
    application/manifest+json     webmanifest;
    video/iso.segment             m4s;
    image/vnd.dxf                 dxf;
}

# The path as requested, before try_files rewrites $uri — the key of the per-path header maps.
map $request_uri $ah_path_raw { "~^(?<ah_p>[^?]*)" $ah_p; }
