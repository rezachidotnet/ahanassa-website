# W30 — HTTP-01 challenges for the origin certificate (certbot --webroot -w /var/lib/ahanassa-acme). Port 80 is open
# to Arvan's ranges only; Arvan passes /.well-known/acme-challenge/ through to the origin (TLS_PLAN.md).
location ^~ /.well-known/acme-challenge/ {
    root /var/lib/ahanassa-acme;
    default_type text/plain;
    try_files $uri =404;
}
