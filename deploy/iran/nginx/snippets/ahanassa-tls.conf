# W30 — origin TLS (Arvan -> iransrv). Certificates are symlinks under /etc/ahanassa/tls/<host>/ so the site files
# never change: first the snakeoil pair (ssl-cert), then the Let's Encrypt files (deploy/iran/TLS_PLAN.md).
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:ahanassa_ssl:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
# No OCSP stapling: it would be an outbound request to the CA, which fails during an international cutoff.
ssl_stapling off;
