# Architecture V1.1 §4.3 (R2-5): the CI fallback reconciler — an independent,
# monitored recovery path for RFQs the Worker paths have not delivered for
# [30] minutes. Same logic as the Worker (lib/rfq-worker/delivery.ts).
# W2: workflow_dispatch ONLY; the schedule is enabled in a later task.
name: RFQ CI reconciler (staging)

on:
  workflow_dispatch:
    inputs:
      max:
        description: "Maximum RFQs to deliver in this run"
        required: false
        default: "10"
  # schedule:
  #   - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: rfq-ci-reconciler-staging
  cancel-in-progress: false

jobs:
  reconcile:
    name: reconcile (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies (immutable)
        run: npm ci

      - name: Reconcile (one RFQ per delivery, idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Staging delivers to the contract stub only (§6.7), never to Odoo.
          ODOO_BASE_URL: https://ahanassa-v11-odoo-stub-staging.nova-b1e6f0.workers.dev
          ODOO_RFQ_API_TOKEN: ${{ secrets.V11_STAGING_ODOO_STUB_BEARER }}
          ODOO_INTAKE_V11: "1"
        run: node scripts/rfq/ci-reconciler.ts --config workers/rfq/wrangler.jsonc --env staging --database DB_OPS --max "${{ inputs.max }}"
