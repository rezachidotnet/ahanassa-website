name: Deploy Production

# Manual, workflow_dispatch-only, reviewer-gated deployment of the application
# code to the real Cloudflare production Worker (env.production in
# wrangler.jsonc — ahanassa-production, serving www.ahanassa.com). This
# workflow deploys application code ONLY — it never applies a D1 migration
# and never mutates a secret.
#
# SOURCE OF TRUTH — this file implements, and must stay consistent with:
#   - docs/release/PRODUCTION_DEPLOY_WORKFLOW_DESIGN.md   (the frozen architecture: trigger,
#     approval gate, A1-A3 preconditions, two-phase deploy, secret handling,
#     smoke gate, rollback policy, evidence scheme)
#   - docs/release/PRODUCTION_PIPELINE_PRECHECKS_REPORT.md (the empirically-corrected
#     staging-provenance mechanism — see A2 below — and the confirmed
#     `wrangler versions upload` secret-inheritance behavior)
#   - .github/workflows/deploy-staging.yml (the proven exact-SHA checkout model,
#     staging resource assertion pattern, and S1-S10 smoke-gate shape this
#     workflow adapts for production)
#
# EXACT-SHA MODEL (same discipline as deploy-staging.yml, stricter format)
# -------------------------------------------------------------------------
# `deploy_ref` must be a full 40-character lowercase-hex commit SHA — never a
# branch name or short SHA (staging tolerates those for operator convenience;
# production does not). The very first step rejects anything else, before
# checkout ever runs.
#
# TWO INDEPENDENT GATES, NEITHER SUBSTITUTES FOR THE OTHER
# -----------------------------------------------------------
# 1. `environment: production` — GitHub pauses the job before ANY step runs
#    (including checkout) until the required reviewer approves. A run that is
#    never approved never executes and never receives the environment's
#    secrets.
# 2. The typed `confirm: "deploy-production"` input — catches a different
#    mistake (an approved reviewer who fat-fingers the dispatch form itself:
#    wrong deploy_ref pasted, wrong workflow selected).
#
# A1 -> A2 -> A3, IN ORDER, ALL BEFORE npm ci / BUILD
# -----------------------------------------------------
# A1 (production target safety, local file parse only) is cheapest and most
# security-critical, so it runs first. A2 (staging provenance, one GitHub API
# scan) runs second. A3 (migration parity, a Cloudflare network call) runs
# last, because it is the most expensive to repeat during a failed dry run.
# No code from `deploy_ref` executes in any capacity until all three pass.
#
# A2 — STAGING PROVENANCE — CORRECTED METHOD, PER PRODUCTION_PIPELINE_PRECHECKS_REPORT.md
# -------------------------------------------------------------------------------------------
# Do NOT compare against `workflow_run.inputs.deploy_ref` (this field does not
# exist anywhere in GitHub's REST or GraphQL API for a historical run — proven
# empirically, not assumed), `head_sha` (the dispatching branch's tip at
# trigger time, NOT the deployed SHA — proven to diverge on a real run in this
# repository's own history), or the auto-created Deployments API object's
# `sha` (same trap: keyed to the triggering ref, not the checked-out
# application ref). The only mechanism proven to work is a log scan of
# `deploy-staging.yml` (workflow 361701517)'s own successful runs for the
# exact line it already prints: `Deploying exact commit: <deploy_ref>`.
#
# TWO-PHASE DEPLOY (never a one-shot `wrangler deploy`/`vinext-cloudflare deploy`)
# -----------------------------------------------------------------------------------
# Phase 1 (`wrangler versions upload`) yields a named, addressable version and
# shifts zero traffic. Its bindings/secrets are verified. Only then does
# Phase 2 (`wrangler versions deploy <id>@<rollout_percentage>`) shift traffic
# — this is what makes a rollback target (`PREVIOUS_VERSION_ID`, captured
# before Phase 1) meaningful: it is always captured before any traffic moves.
#
# CLOUDFLARE_ENV BUILD-TIME GOTCHA (docs/CLOUDFLARE_DEPLOYMENT_STAGE1.md §2)
# -----------------------------------------------------------------------------
# `@cloudflare/vite-plugin` merges a named Wrangler environment's config into
# `dist/server/wrangler.json` at BUILD time, driven by the `CLOUDFLARE_ENV`
# process env var — never at `wrangler` invocation time via `--env`. Every
# `wrangler` command after Build below therefore passes
# `--config dist/server/wrangler.json` and NEVER `--env` again — the config is
# already flattened. Getting this wrong silently targets placeholder/staging
# resources without ever erroring (confirmed the hard way during the real
# Stage 1 production deployment).
#
# NO AUTOMATIC ROLLBACK, NO AUTO-APPLIED MIGRATION, NO contents: write
# -----------------------------------------------------------------------
# A smoke-gate failure fails this job loudly with the exact rollback command
# pre-filled — it never rolls back automatically (a migration-caused failure
# is not fixed by reverting the Worker, and an automatic revert could mask a
# partially-applied data change; a human decides). Migration parity (A3) is
# read-only and never runs `d1 migrations apply` under any condition. This
# workflow is never granted `contents: write` — the deployment manifest
# (docs/release/PRODUCTION_DEPLOYMENT_MANIFEST.md) is an append-only ledger
# updated as a separate, human-reviewed documentation commit after a real
# release, exactly like every other report in docs/release/ — never
# committed to by the workflow itself.
#
# AUDIT FIXES (docs/release/PRODUCTION_WORKFLOW_INDEPENDENT_AUDIT.md,
# docs/release/PRODUCTION_WORKFLOW_AUDIT_FIX_REPORT.md)
# -----------------------------------------------------------------------
# 1. ROLLOUT SPLIT (was CRITICAL): Cloudflare requires every version-spec
#    percentage passed to `wrangler versions deploy` to sum to exactly 100
#    — a single spec below 100 always failed with "percentages add up to
#    N%, but must total exactly 100%" (reproduced live via --dry-run).
#    Phase 2 now computes the complementary percentage for
#    PREVIOUS_VERSION_ID and passes both specs whenever rollout_percentage
#    is not 100, and verifies the generated specs sum to 100 before ever
#    invoking `wrangler`.
# 2. A1 now validates every `env.production.vars` key defined in
#    wrangler.jsonc (was HIGH: only APP_ENV was checked) — see A1 itself
#    for the exact-match vs. pattern-match split and why.
# 3. The smoke gate (S1/S5/S6/S7) now covers fa/en/ar for homepage, catalog
#    index/detail, and RFQ page render (was MEDIUM: only the default
#    locale was checked for those four).
#
# CHECKOUT-VALIDATION HARDENING
# (docs/release/PRODUCTION_CHECKOUT_VALIDATION_HARDENING_REPORT.md)
# -----------------------------------------------------------------------
# Discovered during a live fail-closed test with deploy_ref set to 40
# zeros: a syntactically valid but nonexistent SHA passed the format
# check and reached `actions/checkout@v4`, which failed with a raw,
# uncontrolled git-protocol error ("remote error: upload-pack: not our
# ref") instead of a clear workflow-owned message. A new step, "Verify
# deploy_ref commit exists," now queries the GitHub REST API for the
# commit before checkout ever runs, so a nonexistent (but format-valid)
# deploy_ref fails closed with an unambiguous error first.
#
# RELEASE POLICY GATE (docs/release/RELEASE_POLICY.md §0.2,
# docs/release/GLOBAL_RELEASE_POLICY_ENFORCEMENT_IMPLEMENTATION_REPORT.md)
# -----------------------------------------------------------------------
# Runs right after the exact-SHA checkout, BEFORE A1/A2/A3, npm ci, build,
# Phase 1 upload and Phase 2 traffic shift — before anything touches
# production. It resolves BASE_PRODUCTION_SHA from the ledger's latest
# STABLE_100 row, classifies `git diff BASE_PRODUCTION_SHA..deploy_ref`,
# computes FINAL_RISK = max(declared_risk, computed minimum) and refuses any
# rollout the policy path for FINAL_RISK does not allow (LOW/MEDIUM: 100
# only; HIGH: the 10% canary leg only, with staging provenance). AMBIGUOUS
# (CLASSIFICATION_REQUIRED) stops the run. There is no input that skips it.
#
# TRUST: the engine (lib/ci/release-gate*.ts, release-risk-classifier.ts,
# release-ledger.ts) and the ledger are read from THIS workflow's own commit
# (github.sha) via `git archive`/`git show` — never from the deploy_ref
# checkout, whose code must not run before A1 and which must never be able
# to rewrite the classifier or the ledger that judges it. Path classification
# lives only in release-risk-classifier.ts; this file never reimplements it.

on:
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: >-
          Full 40-character commit SHA to deploy. Must already have a
          successful Deploy Staging run (workflow 361701517) for this exact
          SHA — see the "Verify staging provenance" step. No default; a
          mutable default would destroy the promotion guarantee. Never a
          branch name or short SHA.
        required: true
        type: string
      confirm:
        description: >-
          Type exactly "deploy-production" to confirm. Deliberately different
          from staging's "deploy-staging" so operator muscle memory cannot
          cross environments.
        required: true
        type: string
      declared_risk:
        description: >-
          Your declared release risk (RELEASE_POLICY.md §5/§6). The run
          computes the diff's minimum risk against BASE_PRODUCTION_SHA and
          uses FINAL_RISK = max(declared, computed) — you can escalate,
          never downgrade. LOW/MEDIUM must use rollout 100; HIGH must use
          rollout 10 (the canary leg, promoted later by Promote Production).
        required: true
        type: choice
        options: ["LOW", "MEDIUM", "HIGH"]
      rollout_percentage:
        description: >-
          Traffic percentage for the newly uploaded version. Must be one the
          release policy permits for FINAL_RISK — 100 for LOW/MEDIUM, 10 for
          HIGH — or the release policy gate stops the run.
        required: true
        type: choice
        options: ["10", "50", "100"]
        default: "100"
      skip_staging_provenance:
        description: >-
          Break-glass only. Set true only for a hotfix SHA that legitimately
          never went to staging. Still requires the environment's reviewer to
          approve the run at all, and is loudly recorded in the job summary
          and the production release evidence every time it is used.
        required: false
        type: boolean
        default: false
      expected_current_stable_version_id:
        description: >-
          Worker Version ID you expect PRODUCTION'S CURRENT STABLE version to
          be (this deploy's rollback target), asserted against live
          Cloudflare state before any traffic shifts. REQUIRED, together with
          expected_current_canary_version_id, whenever production already has
          2 active versions (a live canary split) — this workflow refuses to
          guess which one is stable by array position (finding R3; see
          docs/release/PRODUCTION_R3_DETERMINISTIC_VERSION_SELECTION_REPORT.md).
          Leave both empty only when you are certain exactly one version is
          currently serving 100% of production traffic — if you do provide it
          in that case, it is still validated against that single live
          version.
        required: false
        type: string
        default: ""
      expected_current_canary_version_id:
        description: >-
          Worker Version ID you expect PRODUCTION'S CURRENT CANARY version to
          be (the non-rollback-target leg of a live split). REQUIRED together
          with expected_current_stable_version_id whenever production has 2
          active versions. Leave empty when exactly one version is currently
          serving 100% of production traffic.
        required: false
        type: string
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy-production:
    name: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    outputs:
      deployed_sha: ${{ steps.resolve.outputs.deployed_sha }}
      new_version_id: ${{ steps.phase1_upload.outputs.new_version_id }}
      previous_version_id: ${{ steps.previous_version.outputs.previous_version_id }}
      stable_version_id: ${{ steps.previous_version.outputs.stable_version_id }}
      canary_version_id: ${{ steps.previous_version.outputs.canary_version_id }}
      rollout_percentage: ${{ inputs.rollout_percentage }}
      base_production_sha: ${{ steps.policy_gate.outputs.base_production_sha }}
      final_risk: ${{ steps.policy_gate.outputs.final_risk }}
      staging_provenance_run: ${{ steps.provenance.outputs.staging_provenance_run }}
      deployed_at: ${{ steps.evidence.outputs.deployed_at }}
    steps:
      - name: Require explicit confirmation and a full 40-hex-character deploy_ref
        env:
          CONFIRM_INPUT: ${{ inputs.confirm }}
          DEPLOY_REF_INPUT: ${{ inputs.deploy_ref }}
          ROLLOUT_INPUT: ${{ inputs.rollout_percentage }}
          EXPECTED_STABLE_INPUT: ${{ inputs.expected_current_stable_version_id }}
          EXPECTED_CANARY_INPUT: ${{ inputs.expected_current_canary_version_id }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM_INPUT" != "deploy-production" ]; then
            echo "::error::Confirmation input did not equal 'deploy-production'. Aborting without making any changes."
            exit 1
          fi
          if ! [[ "$DEPLOY_REF_INPUT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::deploy_ref must be a full 40-character lowercase-hexadecimal commit SHA, never a branch name or short SHA. Got: \"$DEPLOY_REF_INPUT\""
            exit 1
          fi
          # `type: choice` constrains the dispatch UI's dropdown but is not
          # enforced server-side for an API-triggered dispatch — re-checked
          # here, at the earliest possible point, same discipline as the two
          # checks above.
          if [[ "$ROLLOUT_INPUT" != "10" && "$ROLLOUT_INPUT" != "50" && "$ROLLOUT_INPUT" != "100" ]]; then
            echo "::error::rollout_percentage must be exactly one of 10, 50, or 100. Got: \"$ROLLOUT_INPUT\""
            exit 1
          fi
          # Format-validate the two optional topology-declaration inputs
          # (finding R3) at the earliest possible point, same discipline as
          # deploy_ref/confirm/rollout_percentage above. Their presence/
          # consistency against the LIVE deployment is checked later, by the
          # "Capture PREVIOUS_VERSION_ID" step, once Cloudflare credentials
          # are available — this only rejects a malformed value early.
          UUID_RE='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          if [ -n "$EXPECTED_STABLE_INPUT" ] && ! [[ "$EXPECTED_STABLE_INPUT" =~ $UUID_RE ]]; then
            echo "::error::expected_current_stable_version_id must be empty or a Worker Version UUID. Got: \"$EXPECTED_STABLE_INPUT\""
            exit 1
          fi
          if [ -n "$EXPECTED_CANARY_INPUT" ] && ! [[ "$EXPECTED_CANARY_INPUT" =~ $UUID_RE ]]; then
            echo "::error::expected_current_canary_version_id must be empty or a Worker Version UUID. Got: \"$EXPECTED_CANARY_INPUT\""
            exit 1
          fi
          if [ -n "$EXPECTED_STABLE_INPUT" ] && [ -n "$EXPECTED_CANARY_INPUT" ] && [ "$EXPECTED_STABLE_INPUT" = "$EXPECTED_CANARY_INPUT" ]; then
            echo "::error::expected_current_stable_version_id and expected_current_canary_version_id are identical ('$EXPECTED_STABLE_INPUT'). A canary split requires two distinct versions."
            exit 1
          fi
          echo "Requested deploy_ref (validated 40-hex SHA): $DEPLOY_REF_INPUT"

      # Pre-checkout existence check — hardening
      # (docs/release/PRODUCTION_CHECKOUT_VALIDATION_HARDENING_REPORT.md).
      # A syntactically valid 40-hex string is not necessarily a real commit
      # in this repository — letting `actions/checkout@v4` discover that
      # itself produces a raw, uncontrolled git-protocol error ("remote
      # error: upload-pack: not our ref") instead of a clear, workflow-owned
      # message, and only after the checkout step has already started. This
      # step queries the GitHub REST API (read-only; needs only the
      # already-granted `contents: read` permission, no escalation) for the
      # commit before `actions/checkout` ever runs, so a well-formed but
      # nonexistent deploy_ref fails closed with an unambiguous error at the
      # earliest possible point — mirroring the same "fail closed on any
      # uncertainty" discipline A2's staging-provenance check already uses.
      - name: Verify deploy_ref commit exists (pre-checkout, fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_REF_INPUT: ${{ inputs.deploy_ref }}
        run: |
          set -uo pipefail
          RESOLVED_SHA="$(gh api "repos/${{ github.repository }}/commits/$DEPLOY_REF_INPUT" --jq '.sha' 2>&1)"
          API_STATUS=$?
          if [ $API_STATUS -ne 0 ]; then
            echo "::error::DEPLOY_REF EXISTENCE CHECK FAILED — no commit '$DEPLOY_REF_INPUT' was found in this repository (or the check could not be completed). Aborting before checkout — this SHA does not exist, so it was never staged either. Details: $RESOLVED_SHA"
            exit 1
          fi
          if [ "$RESOLVED_SHA" != "$DEPLOY_REF_INPUT" ]; then
            echo "::error::DEPLOY_REF EXISTENCE CHECK FAILED — the GitHub API resolved deploy_ref to a different SHA ('$RESOLVED_SHA') than requested ('$DEPLOY_REF_INPUT'). Aborting before checkout."
            exit 1
          fi
          echo "Confirmed: commit $DEPLOY_REF_INPUT exists in this repository."

      # fetch-depth: 0 — the release policy gate below needs BASE_PRODUCTION_SHA
      # (an older commit) and this workflow's own commit (github.sha, the
      # trusted engine/ledger source) in the local object store, not only
      # deploy_ref. HEAD is still exactly deploy_ref (asserted next).
      - name: Checkout deploy_ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve deployed SHA
        id: resolve
        env:
          DEPLOY_REF_INPUT: ${{ inputs.deploy_ref }}
        run: |
          set -euo pipefail
          DEPLOYED_SHA="$(git rev-parse HEAD)"
          if [ -z "$DEPLOYED_SHA" ] || ! git cat-file -e "${DEPLOYED_SHA}^{commit}" 2>/dev/null; then
            echo "::error::deploy_ref '$DEPLOY_REF_INPUT' did not resolve to a commit. Aborting before build and deploy."
            exit 1
          fi
          if [ "$DEPLOYED_SHA" != "$DEPLOY_REF_INPUT" ]; then
            echo "::error::Checked-out HEAD ($DEPLOYED_SHA) does not exactly match the requested deploy_ref ($DEPLOY_REF_INPUT). Aborting."
            exit 1
          fi
          echo "DEPLOYED_SHA=$DEPLOYED_SHA" >> "$GITHUB_ENV"
          echo "deployed_sha=$DEPLOYED_SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying exact commit: $DEPLOYED_SHA"
          {
            echo "### Production deployment"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| requested deploy_ref | \`$DEPLOY_REF_INPUT\` |"
            echo "| resolved DEPLOYED_SHA | \`$DEPLOYED_SHA\` |"
            echo "| Cloudflare environment | \`production\` |"
            echo "| Worker | \`ahanassa-production\` |"
            echo "| rollout_percentage | \`${{ inputs.rollout_percentage }}\` |"
            echo "| declared_risk | \`${{ inputs.declared_risk }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Node is needed by the release policy gate (the engine is TypeScript,
      # run with Node 24's type stripping). Setting it up executes nothing
      # from deploy_ref — `cache: npm` only hashes package-lock.json.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # RELEASE POLICY GATE — see this file's header. Everything above is
      # input validation and a read-only checkout; everything below that can
      # reach production (A3's Cloudflare read, Phase 1 upload, Phase 2
      # traffic shift) runs only if this step passes. The engine and the
      # ledger come from POLICY_REF (this workflow's own commit), extracted
      # outside the workspace, so no deploy_ref code runs and a candidate
      # cannot supply its own classifier or ledger.
      - name: "Release policy gate: classify BASE_PRODUCTION_SHA..deploy_ref (fail closed)"
        id: policy_gate
        env:
          POLICY_REF: ${{ github.sha }}
          DECLARED_RISK_INPUT: ${{ inputs.declared_risk }}
          ROLLOUT_INPUT: ${{ inputs.rollout_percentage }}
          SKIP_PROVENANCE_INPUT: ${{ inputs.skip_staging_provenance }}
        run: |
          set -euo pipefail
          ENGINE_DIR="$RUNNER_TEMP/release-policy-engine"
          DECISION_FILE="$RUNNER_TEMP/release-policy-decision.json"
          rm -rf "$ENGINE_DIR" "$DECISION_FILE"
          mkdir -p "$ENGINE_DIR"
          if ! git cat-file -e "${POLICY_REF}^{commit}" 2>/dev/null; then
            echo "::error::RELEASE POLICY GATE FAILED — this workflow's own commit ($POLICY_REF) is not in the local object store, so the trusted policy engine and ledger cannot be read. Refusing to classify with anything else."
            exit 1
          fi
          # --- ENGINE EXTRACTION START (exercised by lib/ci/release-gate.test.ts) ---
          git archive "$POLICY_REF" -- \
            lib/ci/release-gate-cli.ts \
            lib/ci/release-gate.ts \
            lib/ci/release-risk-classifier.ts \
            lib/ci/release-ledger.ts \
            | tar -x -C "$ENGINE_DIR"
          echo '{ "type": "module" }' > "$ENGINE_DIR/package.json"
          RG_REPO_DIR="$GITHUB_WORKSPACE" \
          RG_LEDGER_REF="$POLICY_REF" \
          RG_CANDIDATE_SHA="$DEPLOYED_SHA" \
          RG_DECLARED_RISK="$DECLARED_RISK_INPUT" \
          RG_ROLLOUT_PERCENTAGE="$ROLLOUT_INPUT" \
          RG_SKIP_STAGING_PROVENANCE="$SKIP_PROVENANCE_INPUT" \
          RG_DECISION_FILE="$DECISION_FILE" \
            node --experimental-strip-types "$ENGINE_DIR/lib/ci/release-gate-cli.ts"
          # --- ENGINE EXTRACTION END ---
          # Belt and braces: a zero exit alone is not trusted — the decision
          # record must exist and say PERMITTED with a real FINAL_RISK.
          GATE_RESULT="$(jq -r '.RESULT' "$DECISION_FILE")"
          GATE_FINAL_RISK="$(jq -r '.FINAL_RISK' "$DECISION_FILE")"
          if [ "$GATE_RESULT" != "PERMITTED" ] || ! [[ "$GATE_FINAL_RISK" =~ ^(LOW|MEDIUM|HIGH)$ ]]; then
            echo "::error::RELEASE POLICY GATE FAILED — the gate exited 0 but its decision record is not PERMITTED with a FINAL_RISK (RESULT='$GATE_RESULT', FINAL_RISK='$GATE_FINAL_RISK'). Failing closed."
            exit 1
          fi
          echo "FINAL_RISK=$GATE_FINAL_RISK" >> "$GITHUB_ENV"

      # A1 — Production target safety. Runs BEFORE npm ci / build,
      # so no code from the checked-out ref executes until the production
      # target is proven. This script is intentionally inline: it comes from
      # the workflow file on the dispatch branch, never from the (untrusted)
      # deploy_ref checkout. Mirrors deploy-staging.yml's own
      # assert-staging.cjs pattern exactly, pinned against production's
      # live-verified values (docs/release/PRODUCTION_DEPLOY_WORKFLOW_DESIGN.md §4).
      - name: "A1: assert production target (fail closed)"
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/assert-production.cjs" <<'ASSERT_EOF'
          const fs = require('fs');

          const EXPECTED_WORKER = 'ahanassa-production';
          const EXPECTED_D1 = {
            DB_OPS: { database_name: 'ahanassa-ops-production', database_id: '7240a6a7-c293-4e6e-baf3-95838a3c2944' },
            DB_PUBLIC: { database_name: 'ahanassa-public-production', database_id: '73ba6b50-ef57-4d89-baa9-617a0b0af127' },
          };
          const EXPECTED_ROUTES = [{ pattern: 'www.ahanassa.com', custom_domain: true }];
          const EXPECTED_CRONS = ['*/5 * * * *', '0 */3 * * *', '30 2 * * *'];

          function stripJsonc(src) {
            let out = '';
            let i = 0;
            const n = src.length;
            while (i < n) {
              const c = src[i];
              if (c === '"') {
                let j = i + 1;
                while (j < n) {
                  if (src[j] === '\\') { j += 2; continue; }
                  if (src[j] === '"') { j++; break; }
                  j++;
                }
                out += src.slice(i, j);
                i = j;
                continue;
              }
              if (c === '/' && src[i + 1] === '/') {
                while (i < n && src[i] !== '\n') i++;
                continue;
              }
              if (c === '/' && src[i + 1] === '*') {
                i += 2;
                while (i < n && !(src[i] === '*' && src[i + 1] === '/')) i++;
                i += 2;
                continue;
              }
              out += c;
              i++;
            }
            return out.replace(/,(\s*[}\]])/g, '$1');
          }

          function fail(msg) {
            console.log('::error::PRODUCTION TARGET ASSERTION FAILED — ' + msg);
            process.exit(1);
          }

          if (!fs.existsSync('wrangler.jsonc')) {
            fail('wrangler.jsonc not found in the checked-out deploy_ref. This ref does not contain the application.');
          }

          let cfg;
          try {
            cfg = JSON.parse(stripJsonc(fs.readFileSync('wrangler.jsonc', 'utf8')));
          } catch (e) {
            fail('wrangler.jsonc could not be parsed: ' + e.message);
          }

          const prod = cfg && cfg.env && cfg.env.production;
          if (!prod || typeof prod !== 'object') fail('wrangler.jsonc has no env.production block.');

          if (prod.name !== EXPECTED_WORKER) {
            fail('env.production.name is "' + prod.name + '", expected "' + EXPECTED_WORKER + '".');
          }

          // Production vars — AUDIT FIX (docs/release/PRODUCTION_WORKFLOW_INDEPENDENT_AUDIT.md
          // HIGH finding: this block previously checked only APP_ENV, leaving
          // ODOO_BASE_URL/ODOO_DATABASE/ODOO_CRM_TEAM_ID/NEXT_PUBLIC_TURNSTILE_SITE_KEY
          // etc. unchecked — a tampered/accidental ODOO_BASE_URL in
          // deploy_ref would have passed A1 undetected, silently misrouting
          // every RFQ synced after that release). Every var declared under
          // env.production.vars in wrangler.jsonc today is covered below —
          // none of these are secrets (the two real Worker secrets,
          // ODOO_RFQ_API_TOKEN and TURNSTILE_SECRET_KEY, are never declared
          // in wrangler.jsonc at all — see the "Verify secret inheritance"
          // step further down), so printing them in full on failure/success
          // is safe.
          //
          // Two different validation strengths, deliberately:
          // - EXPECTED_VARS: identity-bearing values that must never change
          //   from one specific pinned string (which Odoo instance/database/
          //   CRM team, which Turnstile site) — exact match, same strength
          //   as the Worker name / D1 ids above.
          // - EXPECTED_VAR_PATTERNS / EXPECTED_VAR_PRESENT_ONLY: the three
          //   feature-flag-style vars wrangler.jsonc's own comments document
          //   as deliberately, independently flippable in a later, separate
          //   config commit (never bundled with an app-code deploy) — these
          //   are validated for presence and a well-formed value, not pinned
          //   to one exact value, so this assertion never blocks the
          //   documented future flip of PRICE_STRIP_ENABLED/HOMEPAGE_RANKING_MODE.
          if (!prod.vars || typeof prod.vars !== 'object') {
            fail('env.production has no vars block.');
          }

          const EXPECTED_VARS = {
            APP_ENV: 'production',
            ODOO_BASE_URL: 'https://odoo.ahanassa.com',
            ODOO_DATABASE: 'ahanassa',
            ODOO_CRM_TEAM_ID: '1',
            NEXT_PUBLIC_TURNSTILE_SITE_KEY: '0x4AAAAAAEi2RZ3NHcqTk0ej',
          };
          for (const [key, expected] of Object.entries(EXPECTED_VARS)) {
            const actual = prod.vars[key];
            if (actual !== expected) {
              fail('env.production.vars.' + key + ' is "' + actual + '", expected "' + expected + '".');
            }
          }

          const EXPECTED_VAR_PATTERNS = {
            PRICE_STRIP_ENABLED: /^(true|false)$/,
            HOMEPAGE_RANKING_MODE: /^(base|auto)$/,
          };
          for (const [key, pattern] of Object.entries(EXPECTED_VAR_PATTERNS)) {
            const actual = prod.vars[key];
            if (typeof actual !== 'string' || !pattern.test(actual)) {
              fail('env.production.vars.' + key + ' is "' + actual + '", expected to match ' + pattern + '.');
            }
          }

          const EXPECTED_VAR_PRESENT_ONLY = ['ENABLED_PRICE_PROVIDERS'];
          for (const key of EXPECTED_VAR_PRESENT_ONLY) {
            if (typeof prod.vars[key] !== 'string') {
              fail('env.production.vars.' + key + ' is missing or not a string (got "' + prod.vars[key] + '").');
            }
          }

          const d1 = Array.isArray(prod.d1_databases) ? prod.d1_databases : [];
          const seenD1 = new Set();
          for (const b of d1) {
            const exp = EXPECTED_D1[b.binding];
            if (!exp) fail('env.production declares an unexpected D1 binding "' + b.binding + '".');
            if (b.database_name !== exp.database_name) {
              fail('env.production D1 ' + b.binding + ' database_name is "' + b.database_name + '", expected "' + exp.database_name + '".');
            }
            if (b.database_id !== exp.database_id) {
              fail('env.production D1 ' + b.binding + ' database_id does not match the expected production database.');
            }
            seenD1.add(b.binding);
          }
          for (const k of Object.keys(EXPECTED_D1)) {
            if (!seenD1.has(k)) fail('env.production is missing the expected D1 binding "' + k + '".');
          }

          const routes = Array.isArray(prod.routes) ? prod.routes : [];
          if (routes.length !== EXPECTED_ROUTES.length || routes.some((r, i) => r.pattern !== EXPECTED_ROUTES[i].pattern || r.custom_domain !== EXPECTED_ROUTES[i].custom_domain)) {
            fail('env.production.routes is ' + JSON.stringify(routes) + ', expected exactly ' + JSON.stringify(EXPECTED_ROUTES) + ' — a deploy must never silently detach or add to the live custom domain.');
          }

          if (prod.workers_dev !== true) {
            fail('env.production.workers_dev is "' + prod.workers_dev + '", expected true (regression class DOCUMENT_AUDIT_REPORT.md DAR-050).');
          }

          const crons = (prod.triggers && Array.isArray(prod.triggers.crons)) ? prod.triggers.crons : [];
          if (crons.length !== EXPECTED_CRONS.length || crons.some((c, i) => c !== EXPECTED_CRONS[i])) {
            fail('env.production.triggers.crons is ' + JSON.stringify(crons) + ', expected exactly ' + JSON.stringify(EXPECTED_CRONS) + ' — a trigger change must be a deliberate, reviewed config commit, never a deploy-time surprise.');
          }

          // Literal-free denylist: no string anywhere under env.production may
          // name the staging Worker/databases/queues. Mirror image of
          // staging's own live-environment scan — keeps a doctored ref from
          // redirecting this workflow at the wrong target in either direction.
          const offenders = [];
          (function walk(node, trail) {
            if (typeof node === 'string') {
              if (/staging/i.test(node)) offenders.push(trail + ' = ' + node);
              return;
            }
            if (Array.isArray(node)) { node.forEach((v, i) => walk(v, trail + '[' + i + ']')); return; }
            if (node && typeof node === 'object') {
              for (const [k, v] of Object.entries(node)) {
                if (/staging/i.test(k)) offenders.push(trail + '.' + k + ' (key)');
                walk(v, trail + '.' + k);
              }
            }
          })(prod, 'env.production');
          if (offenders.length > 0) {
            fail('env.production names the staging environment: ' + offenders.join('; '));
          }

          console.log('Production target assertion PASSED.');
          console.log('  worker      : ' + prod.name);
          console.log('  DB_OPS      : ' + EXPECTED_D1.DB_OPS.database_name);
          console.log('  DB_PUBLIC   : ' + EXPECTED_D1.DB_PUBLIC.database_name);
          console.log('  routes      : ' + JSON.stringify(routes));
          console.log('  workers_dev : ' + prod.workers_dev);
          console.log('  crons       : ' + JSON.stringify(crons));
          console.log('  vars        : ' + JSON.stringify(prod.vars));
          console.log('  staging-environment identifiers inside env.production: none');
          ASSERT_EOF
          node "$RUNNER_TEMP/assert-production.cjs"

      # A2 — Staging provenance. Requires `actions: read` (job-level
      # permission above) to read another workflow's run logs. Fails closed
      # on any API error, rate limit, or malformed response — "not verified"
      # is always treated the same as "verified false", never as "verified
      # true" (docs/release/PRODUCTION_DEPLOY_WORKFLOW_DESIGN.md §3).
      - name: "A2: verify staging provenance (Deploy Staging log scan)"
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP_PROVENANCE: ${{ inputs.skip_staging_provenance }}
        run: |
          set -uo pipefail
          STAGING_WORKFLOW_ID=361701517
          FOUND_RUN=""

          # Do NOT use workflow_run.inputs.deploy_ref (does not exist on any
          # historical run via REST or GraphQL — confirmed empirically,
          # PRODUCTION_PIPELINE_PRECHECKS_REPORT.md §2 Step 3), head_sha (the
          # dispatching branch's tip at trigger time, proven to diverge from
          # the actually-deployed commit on a real run in this repository),
          # or the Deployments API's auto-created `sha` (same trap, keyed to
          # the triggering ref). The only mechanism proven correct is
          # scanning each successful run's own job log for the exact line
          # deploy-staging.yml already prints after resolving the checkout:
          # "Deploying exact commit: <sha>".
          RUN_IDS="$(gh api "repos/${{ github.repository }}/actions/workflows/$STAGING_WORKFLOW_ID/runs?status=success&per_page=100" --jq '.workflow_runs[].id' 2>/dev/null)"
          API_STATUS=$?

          if [ $API_STATUS -ne 0 ]; then
            echo "::error::STAGING PROVENANCE ASSERTION FAILED — could not list Deploy Staging (workflow $STAGING_WORKFLOW_ID) runs via the GitHub API. Treated as NOT verified, never as verified."
            exit 1
          fi

          for RUN_ID in $RUN_IDS; do
            JOB_ID="$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" --jq '.jobs[0].id // empty' 2>/dev/null)"
            if [ -z "$JOB_ID" ]; then
              continue
            fi
            # Written to a file and grepped from there, deliberately never
            # held only in a shell variable and piped — a job log can be
            # several hundred KB, and matching straight off a file is the
            # more robust, unambiguous form for a fail-closed safety check.
            LOG_FILE="$RUNNER_TEMP/staging-run-$RUN_ID.log"
            gh api --allow-escape-sequences "repos/${{ github.repository }}/actions/jobs/$JOB_ID/logs" 2>/dev/null | sed -E 's/\x1b\[[0-9;]*m//g' > "$LOG_FILE"
            if grep -qF "Deploying exact commit: $DEPLOYED_SHA" "$LOG_FILE"; then
              FOUND_RUN="$RUN_ID"
              break
            fi
          done

          if [ -n "$FOUND_RUN" ]; then
            echo "Staging provenance confirmed: Deploy Staging run $FOUND_RUN successfully deployed $DEPLOYED_SHA."
            echo "staging_provenance_run=$FOUND_RUN" >> "$GITHUB_OUTPUT"
            {
              echo ""
              echo "### Staging provenance"
              echo ""
              echo "Confirmed via Deploy Staging (workflow $STAGING_WORKFLOW_ID) run [$FOUND_RUN](https://github.com/${{ github.repository }}/actions/runs/$FOUND_RUN)."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$SKIP_PROVENANCE" = "true" ] && [ "${FINAL_RISK:-}" = "HIGH" ]; then
            # Defense in depth: the release policy gate already refuses this
            # combination (HIGH_REQUIRES_STAGING_PROVENANCE). A HIGH release
            # never uses the break-glass path (RELEASE_POLICY.md §5).
            echo "::error::STAGING PROVENANCE ASSERTION FAILED — FINAL_RISK is HIGH and no successful Deploy Staging run contains 'Deploying exact commit: $DEPLOYED_SHA'. skip_staging_provenance is never honored for a HIGH release."
            exit 1
          elif [ "$SKIP_PROVENANCE" = "true" ] && [ -n "${FINAL_RISK:-}" ]; then
            echo "::warning::STAGING PROVENANCE SKIPPED — skip_staging_provenance=true. Deploying $DEPLOYED_SHA with NO staging proof. This MUST be justified when the production deployment manifest is appended."
            echo "staging_provenance_run=SKIPPED" >> "$GITHUB_OUTPUT"
            {
              echo ""
              echo "### Staging provenance"
              echo ""
              echo "**SKIPPED** (\`skip_staging_provenance=true\`) — $DEPLOYED_SHA was deployed with NO staging proof. Break-glass path used; this run was still gated by the production environment's required reviewer."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::STAGING PROVENANCE ASSERTION FAILED — no successful Deploy Staging run (workflow $STAGING_WORKFLOW_ID) contains the log line 'Deploying exact commit: $DEPLOYED_SHA'. This SHA has not been proven on staging."
            exit 1
          fi

      # A3 — Migration parity. Read-only only: `d1 migrations list`, never
      # `d1 migrations apply`. If either database has a pending migration,
      # this workflow stops — applying it remains a separate, explicit,
      # manual operator action (docs/release/CI_CD_POLICY.md), never
      # performed by this workflow under any input or flag.
      - name: "A3: migration parity gate (read-only, never auto-applied)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DB_OPS_STATE="$(npx wrangler d1 migrations list DB_OPS --config wrangler.jsonc --env production --remote 2>&1)"
          echo "$DB_OPS_STATE"
          if ! echo "$DB_OPS_STATE" | grep -q "No migrations to apply"; then
            echo "::error::MIGRATION PARITY ASSERTION FAILED — DB_OPS has migrations pending on production that deploy_ref's code may depend on. This workflow never applies a migration itself — run the separate, manual, documented procedure against DB_OPS first (docs/release/CI_CD_POLICY.md), then re-run this workflow."
            exit 1
          fi

          DB_PUBLIC_STATE="$(npx wrangler d1 migrations list DB_PUBLIC --config wrangler.jsonc --env production --remote 2>&1)"
          echo "$DB_PUBLIC_STATE"
          if ! echo "$DB_PUBLIC_STATE" | grep -q "No migrations to apply"; then
            echo "::error::MIGRATION PARITY ASSERTION FAILED — DB_PUBLIC has migrations pending on production. Migrations are a separate, manual, human-run action, never auto-applied by this workflow — run the documented procedure against DB_PUBLIC first (docs/release/CI_CD_POLICY.md), then re-run this workflow."
            exit 1
          fi

          echo "Migration parity confirmed: DB_OPS and DB_PUBLIC both report no pending migrations on production."

      - name: Install dependencies (immutable)
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      # CLOUDFLARE_ENV must be set at BUILD time, not passed as --env to a
      # later wrangler command — see this file's header comment. Every
      # `wrangler` invocation from here on passes
      # --config dist/server/wrangler.json and never --env again.
      - name: Build (production config baked into dist/server/wrangler.json)
        env:
          CLOUDFLARE_ENV: production
        run: |
          set -euo pipefail
          rm -rf dist
          npm run build

      # Captured BEFORE Phase 1 uploads anything — "a release whose rollback
      # target was not captured is not a completed release"
      # (docs/release/PRODUCTION_DEPLOY_WORKFLOW_DESIGN.md §9). Fails closed:
      # an empty result, or any topology this workflow cannot classify with
      # certainty, blocks the release rather than proceeding with a guessed
      # rollback target.
      #
      # DETERMINISTIC VERSION ROLE DISCOVERY — fixes finding R3
      # (docs/release/PRODUCTION_CANARY_SMOKE_GATE_FIX_REPORT.md §5,
      # docs/release/PRODUCTION_R3_DETERMINISTIC_VERSION_SELECTION_REPORT.md).
      # -----------------------------------------------------------------
      # Previously: `jq -r '.[-1].versions[0].version_id'` — picked whichever
      # version happened to sort first inside the live deployment's
      # `versions[]` array. That is safe ONLY while a single version serves
      # 100% (array position and "the one version" are then the same thing).
      # It is UNSAFE the moment production is already running a canary split:
      # on the split live as of 2026-09-21 (canary 4a32c5f9… @10%, stable
      # b07d8697… @90%), `.versions[0]` resolved to the CANARY, not the
      # proven-stable rollback target — inverting PREVIOUS_VERSION_ID and
      # handing an uncertified version 90% of traffic on the next split
      # deploy while the real stable target dropped out of rollback reach.
      #
      # Fixed method — position-independent, the same technique
      # verify-production.yml's V3 step already proved live against this
      # exact production topology (run 35567845828,
      # docs/release/PRODUCTION_10_PERCENT_OFFICIAL_VERIFICATION_REPORT.md):
      #   1. Read the live deployment's versions[] (still `.[-1]` to pick the
      #      newest deployment EVENT — an ordering guarantee, not the
      #      array-position guess this fix removes; see the comment on that
      #      line below).
      #   2. Classify by COUNT, never by index:
      #        - 1 version  -> it must be at 100%; that version IS stable,
      #          unambiguously (there is nothing else it could be).
      #        - 2 versions -> both expected_current_stable_version_id and
      #          expected_current_canary_version_id inputs are REQUIRED; each
      #          expected id is matched by exact version_id equality against
      #          the live set, never by position, and any live version
      #          matching neither expected id is an unexpected topology that
      #          fails closed.
      #        - anything else (0, or 3+) -> fails closed; this workflow does
      #          not know how to classify that topology and does not guess.
      #   3. Every live percentage is validated to be a well-formed integer
      #      in (0, 100], and the total must be exactly 100, before any role
      #      is trusted.
      - name: Capture PREVIOUS_VERSION_ID (rollback target, before any traffic shift)
        id: previous_version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_STABLE_INPUT: ${{ inputs.expected_current_stable_version_id }}
          EXPECTED_CANARY_INPUT: ${{ inputs.expected_current_canary_version_id }}
        run: |
          set -euo pipefail
          npx wrangler deployments list --config dist/server/wrangler.json --json > "$RUNNER_TEMP/deployments.json"

          # wrangler sorts deployments ascending by created_on before
          # printing JSON, so `.[-1]` is the newest deployment EVENT — an
          # ordering guarantee (verified against wrangler 4.x's
          # versionsDeploymentsListHandler; the same reasoning
          # verify-production.yml's V3 step already relies on), never a
          # positional guess about WHICH VERSION inside that event is stable
          # — that guess is exactly what the rest of this step removes.
          jq '.[-1]' "$RUNNER_TEMP/deployments.json" > "$RUNNER_TEMP/latest-deployment.json"

          # --- ROLE DISCOVERY START (extracted verbatim by
          #     lib/ci/production-version-role-discovery.test.ts) ---
          COUNT="$(jq -r '.versions | length' "$RUNNER_TEMP/latest-deployment.json")"

          # Every percentage must be a well-formed integer in (0, 100] before
          # any role logic trusts it — a version listed as "receiving
          # traffic" with a zero, negative, non-integer, or non-numeric
          # percentage is an unverifiable/malformed topology, not a
          # legitimate state to reason about.
          BAD_PCT="$(jq -r '[.versions[] | select((.percentage | type != "number") or (.percentage <= 0) or (.percentage > 100) or ((.percentage | floor) != .percentage))] | length' "$RUNNER_TEMP/latest-deployment.json")"
          if [ "$BAD_PCT" != "0" ]; then
            echo "::error::ROLLBACK TARGET CAPTURE FAILED — the live deployment reports $BAD_PCT version(s) with a malformed traffic percentage (not a well-formed integer in (0, 100]). Refusing to guess a rollback target from an unverifiable topology."
            exit 1
          fi

          TOTAL_PCT="$(jq -r '[.versions[].percentage] | add // 0' "$RUNNER_TEMP/latest-deployment.json")"
          if [ "$TOTAL_PCT" != "100" ]; then
            echo "::error::ROLLBACK TARGET CAPTURE FAILED — the live deployment's version percentages total ${TOTAL_PCT}%, not 100%. Refusing to guess a rollback target from an inconsistent topology."
            exit 1
          fi

          STABLE_VERSION_ID=""
          CANARY_VERSION_ID=""

          if [ "$COUNT" = "1" ]; then
            if [ -n "$EXPECTED_CANARY_INPUT" ]; then
              echo "::error::ROLLBACK TARGET CAPTURE FAILED — expected_current_canary_version_id was provided ('$EXPECTED_CANARY_INPUT'), but production is currently serving exactly ONE version (no canary is live). Topology mismatch — refusing to guess."
              exit 1
            fi
            # `.versions[]` (iterate-all), never `.versions[0]` (positional
            # index) — COUNT is already confirmed to be exactly 1 above, so
            # this yields exactly one line either way; the point is that
            # nothing here is selected BY POSITION.
            SOLE_ID="$(jq -r '.versions[] | .version_id' "$RUNNER_TEMP/latest-deployment.json")"
            SOLE_PCT="$(jq -r '.versions[] | .percentage' "$RUNNER_TEMP/latest-deployment.json")"
            if [ "$SOLE_PCT" != "100" ]; then
              echo "::error::ROLLBACK TARGET CAPTURE FAILED — production has exactly one active version ($SOLE_ID) but it is serving ${SOLE_PCT}%, not 100%. This is not a topology this workflow recognizes — refusing to guess."
              exit 1
            fi
            if [ -n "$EXPECTED_STABLE_INPUT" ] && [ "$EXPECTED_STABLE_INPUT" != "$SOLE_ID" ]; then
              echo "::error::ROLLBACK TARGET CAPTURE FAILED — expected_current_stable_version_id ('$EXPECTED_STABLE_INPUT') does not match the single live version ($SOLE_ID). Refusing to guess."
              exit 1
            fi
            STABLE_VERSION_ID="$SOLE_ID"
            echo "Topology: single version at 100% — classified deterministically as stable (no ambiguity possible with one candidate)."
          elif [ "$COUNT" = "2" ]; then
            if [ -z "$EXPECTED_STABLE_INPUT" ] || [ -z "$EXPECTED_CANARY_INPUT" ]; then
              echo "::error::ROLLBACK TARGET CAPTURE FAILED — production currently has 2 active versions (a live canary split). This workflow will not guess which one is the rollback target by array position (finding R3) — both expected_current_stable_version_id and expected_current_canary_version_id are required inputs whenever a canary is live. Re-dispatch with both set, after confirming the live topology (e.g. via Verify Production)."
              exit 1
            fi
            if [ "$EXPECTED_STABLE_INPUT" = "$EXPECTED_CANARY_INPUT" ]; then
              echo "::error::ROLLBACK TARGET CAPTURE FAILED — expected_current_stable_version_id and expected_current_canary_version_id are identical ('$EXPECTED_STABLE_INPUT'). Cannot establish distinct roles from a single id."
              exit 1
            fi
            STABLE_PCT="$(jq -r --arg v "$EXPECTED_STABLE_INPUT" '[.versions[] | select(.version_id == $v) | .percentage] | first // empty' "$RUNNER_TEMP/latest-deployment.json")"
            CANARY_PCT="$(jq -r --arg v "$EXPECTED_CANARY_INPUT" '[.versions[] | select(.version_id == $v) | .percentage] | first // empty' "$RUNNER_TEMP/latest-deployment.json")"
            if [ -z "$STABLE_PCT" ]; then
              echo "::error::ROLLBACK TARGET CAPTURE FAILED — expected_current_stable_version_id ('$EXPECTED_STABLE_INPUT') is not one of the versions currently receiving production traffic. Refusing to guess."
              exit 1
            fi
            if [ -z "$CANARY_PCT" ]; then
              echo "::error::ROLLBACK TARGET CAPTURE FAILED — expected_current_canary_version_id ('$EXPECTED_CANARY_INPUT') is not one of the versions currently receiving production traffic. Refusing to guess."
              exit 1
            fi
            UNEXPECTED="$(jq -r --arg s "$EXPECTED_STABLE_INPUT" --arg c "$EXPECTED_CANARY_INPUT" '[.versions[] | select(.version_id != $s and .version_id != $c) | .version_id] | join(",")' "$RUNNER_TEMP/latest-deployment.json")"
            if [ -n "$UNEXPECTED" ]; then
              echo "::error::ROLLBACK TARGET CAPTURE FAILED — the live deployment has an unexpected version receiving traffic ($UNEXPECTED) that matches neither expected id. Refusing to guess."
              exit 1
            fi
            STABLE_VERSION_ID="$EXPECTED_STABLE_INPUT"
            CANARY_VERSION_ID="$EXPECTED_CANARY_INPUT"
            echo "Topology: live 2-version canary split confirmed — stable $STABLE_VERSION_ID @ ${STABLE_PCT}%, canary $CANARY_VERSION_ID @ ${CANARY_PCT}%, matched by exact version id, never by array position."
          else
            echo "::error::ROLLBACK TARGET CAPTURE FAILED — production currently has $COUNT active version(s) receiving traffic. This workflow only recognizes exactly 1 (single stable) or 2 (an active canary split) — refusing to guess a rollback target for any other topology. Investigate manually before re-dispatching."
            exit 1
          fi

          if [ -z "$STABLE_VERSION_ID" ]; then
            echo "::error::ROLLBACK TARGET CAPTURE FAILED — could not determine the stable version deterministically. Aborting before any traffic shift."
            exit 1
          fi

          PREVIOUS_VERSION_ID="$STABLE_VERSION_ID"
          ROLLBACK_VERSION_ID="$STABLE_VERSION_ID"
          # --- ROLE DISCOVERY END ---

          if [ -z "$PREVIOUS_VERSION_ID" ]; then
            echo "::error::ROLLBACK TARGET CAPTURE FAILED — could not determine the currently-serving Worker Version ID before deploying. Aborting before any traffic shift."
            exit 1
          fi
          echo "PREVIOUS_VERSION_ID=$PREVIOUS_VERSION_ID" >> "$GITHUB_ENV"
          echo "previous_version_id=$PREVIOUS_VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "stable_version_id=$STABLE_VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "canary_version_id=$CANARY_VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "Currently-serving stable version (rollback target): $PREVIOUS_VERSION_ID"

      # Phase 1 — zero traffic shift. Yields an addressable, inspectable
      # version handle before anything is promoted.
      - name: "Phase 1: wrangler versions upload"
        id: phase1_upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler versions upload --config dist/server/wrangler.json \
            --message "Production release - SHA $DEPLOYED_SHA - run ${{ github.run_id }}" \
            2>&1 | tee "$RUNNER_TEMP/versions-upload.log"

          NEW_VERSION_ID="$(
            sed -E 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/versions-upload.log" \
              | grep -o 'Worker Version ID:.*' \
              | tail -n1 \
              | sed -E 's/^Worker Version ID:[[:space:],]*//' \
              | tr -d '[:space:]'
          )"
          if [ -z "$NEW_VERSION_ID" ]; then
            echo "::error::PHASE 1 UPLOAD FAILED — could not find a Worker Version ID in the versions upload output. No traffic has been shifted."
            exit 1
          fi
          echo "NEW_VERSION_ID=$NEW_VERSION_ID" >> "$GITHUB_ENV"
          echo "new_version_id=$NEW_VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "Uploaded new version (0% traffic so far): $NEW_VERSION_ID"

      # Defense-in-depth, kept even though PRODUCTION_PIPELINE_PRECHECKS_REPORT.md
      # §1 already empirically proved `versions upload` inherits the Worker's
      # attached secrets — this check is what makes that finding continue to
      # hold on every future release rather than being trusted once and
      # forgotten, and it also re-confirms the actual UPLOADED version's
      # bindings, not merely the source config A1 already parsed.
      # Names only, never values — Cloudflare's API has no mechanism to
      # return a secret's value, and this step never attempts to construct
      # or print one.
      - name: Verify secret inheritance and production bindings on the new version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          VERSION_JSON_FILE="$RUNNER_TEMP/new-version.json"
          npx wrangler versions view "$NEW_VERSION_ID" --config dist/server/wrangler.json --json > "$VERSION_JSON_FILE"

          for SECRET_NAME in ODOO_RFQ_API_TOKEN TURNSTILE_SECRET_KEY; do
            FOUND="$(jq -r --arg name "$SECRET_NAME" '[.resources.bindings[]? | select(.name == $name and .type == "secret_text")] | length' "$VERSION_JSON_FILE")"
            if [ "$FOUND" != "1" ]; then
              echo "::error::NEW VERSION SAFETY ASSERTION FAILED — secret \"$SECRET_NAME\" is not present (as secret_text) on newly uploaded version $NEW_VERSION_ID. Refusing to promote a version that would serve requests with a missing secret."
              exit 1
            fi
          done

          DB_OPS_ID="$(jq -r '.resources.bindings[]? | select(.name=="DB_OPS") | .database_id // empty' "$VERSION_JSON_FILE")"
          DB_PUBLIC_ID="$(jq -r '.resources.bindings[]? | select(.name=="DB_PUBLIC") | .database_id // empty' "$VERSION_JSON_FILE")"
          QUEUE_NAME="$(jq -r '.resources.bindings[]? | select(.name=="ODOO_SYNC_QUEUE") | .queue_name // empty' "$VERSION_JSON_FILE")"

          if [ "$DB_OPS_ID" != "7240a6a7-c293-4e6e-baf3-95838a3c2944" ]; then
            echo "::error::NEW VERSION SAFETY ASSERTION FAILED — uploaded version's DB_OPS binding is \"$DB_OPS_ID\", expected the production database."
            exit 1
          fi
          if [ "$DB_PUBLIC_ID" != "73ba6b50-ef57-4d89-baa9-617a0b0af127" ]; then
            echo "::error::NEW VERSION SAFETY ASSERTION FAILED — uploaded version's DB_PUBLIC binding is \"$DB_PUBLIC_ID\", expected the production database."
            exit 1
          fi
          if [ "$QUEUE_NAME" != "ahanassa-odoo-sync-production" ]; then
            echo "::error::NEW VERSION SAFETY ASSERTION FAILED — uploaded version's ODOO_SYNC_QUEUE binding is \"$QUEUE_NAME\", expected ahanassa-odoo-sync-production."
            exit 1
          fi

          echo "New version $NEW_VERSION_ID: both required secrets present (names only, values never read), production D1/queue bindings confirmed correct."

      # Phase 2 — the one step in this workflow that shifts real traffic.
      # Everything before this point is read-only or zero-traffic.
      #
      # ROLLOUT SPLIT — AUDIT FIX for a CRITICAL finding
      # (docs/release/PRODUCTION_WORKFLOW_INDEPENDENT_AUDIT.md §6):
      # Cloudflare requires every version-spec percentage passed to
      # `wrangler versions deploy` to sum to exactly 100 — a single spec
      # below 100 fails outright ("The specified traffic percentages add up
      # to N%, but must total exactly 100%"), reproduced live via --dry-run
      # against the real production Worker during that audit. A rollout
      # below 100% therefore explicitly deploys the complementary
      # percentage onto PREVIOUS_VERSION_ID in the same call:
      #   100 -> new@100
      #    50 -> new@50  previous@50
      #    10 -> new@10  previous@90
      - name: "Phase 2: wrangler versions deploy (rollout ${{ inputs.rollout_percentage }}%)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ROLLOUT_PCT="${{ inputs.rollout_percentage }}"

          DEPLOY_SPECS=("$NEW_VERSION_ID@$ROLLOUT_PCT")
          if [ "$ROLLOUT_PCT" != "100" ]; then
            REMAINDER=$((100 - ROLLOUT_PCT))
            DEPLOY_SPECS+=("$PREVIOUS_VERSION_ID@$REMAINDER")
          fi

          # Verify the generated command before execution: every specified
          # percentage must sum to exactly 100 (Cloudflare's own hard
          # requirement) — checked here too so a future bug in the
          # arithmetic above fails this workflow closed rather than ever
          # reaching `wrangler` with a malformed split.
          TOTAL_PCT=0
          for SPEC in "${DEPLOY_SPECS[@]}"; do
            SPEC_PCT="${SPEC##*@}"
            TOTAL_PCT=$((TOTAL_PCT + SPEC_PCT))
          done
          if [ "$TOTAL_PCT" -ne 100 ]; then
            echo "::error::ROLLOUT SPLIT ASSERTION FAILED — generated version-spec percentages (${DEPLOY_SPECS[*]}) sum to $TOTAL_PCT, not 100. Refusing to deploy."
            exit 1
          fi

          echo "Rollout ${ROLLOUT_PCT}% verified — deploying version-spec(s): ${DEPLOY_SPECS[*]}"
          echo "ROLLOUT_DEPLOY_SPECS=${DEPLOY_SPECS[*]}" >> "$GITHUB_ENV"

          npx wrangler versions deploy "${DEPLOY_SPECS[@]}" \
            --config dist/server/wrangler.json \
            --message "Production release - SHA $DEPLOYED_SHA - run ${{ github.run_id }}" \
            --yes
          echo "Promoted: ${DEPLOY_SPECS[*]}"

      # Evidence capture — durable, three places: job outputs, job summary,
      # and an uploaded artifact. Captured before the smoke gate so evidence
      # exists even if smoke fails (the release already happened; the smoke
      # gate reports on it, it cannot retroactively prevent it).
      - name: Capture production release evidence
        id: evidence
        run: |
          set -euo pipefail
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "deployed_at=$DEPLOYED_AT" >> "$GITHUB_OUTPUT"

          EVIDENCE_FILE="$RUNNER_TEMP/production-release-evidence.json"
          cat > "$EVIDENCE_FILE" <<EOF
          {
            "environment": "production",
            "worker_name": "ahanassa-production",
            "new_version_id": "$NEW_VERSION_ID",
            "previous_version_id": "$PREVIOUS_VERSION_ID",
            "deployed_sha": "$DEPLOYED_SHA",
            "rollout_percentage": "${{ inputs.rollout_percentage }}",
            "rollout_deploy_specs": "$ROLLOUT_DEPLOY_SPECS",
            "staging_provenance_run": "${{ steps.provenance.outputs.staging_provenance_run }}",
            "skip_staging_provenance": "${{ inputs.skip_staging_provenance }}",
            "workflow_run_id": "${{ github.run_id }}",
            "workflow_run_attempt": "${{ github.run_attempt }}",
            "deployed_at": "$DEPLOYED_AT"
          }
          EOF
          # Embed the release policy gate's full decision (RELEASE_POLICY.md
          # §15) — base, declared/computed/final risk, triggered rules and
          # every changed file — plus the top-level fields a ledger row needs.
          jq --slurpfile policy "$RUNNER_TEMP/release-policy-decision.json" \
            '. + {
              operation_type: $policy[0].OPERATION_TYPE,
              base_production_sha: $policy[0].BASE_PRODUCTION_SHA,
              declared_risk: $policy[0].DECLARED_RISK,
              computed_minimum_risk: $policy[0].COMPUTED_MINIMUM_RISK,
              final_risk: $policy[0].FINAL_RISK,
              expected_release_path: $policy[0].EXPECTED_RELEASE_PATH,
              release_policy: $policy[0]
            }' "$EVIDENCE_FILE" > "$EVIDENCE_FILE.tmp"
          mv "$EVIDENCE_FILE.tmp" "$EVIDENCE_FILE"
          echo "EVIDENCE_FILE=$EVIDENCE_FILE" >> "$GITHUB_ENV"

          {
            echo ""
            echo "### Production release evidence"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| New Worker Version ID | \`$NEW_VERSION_ID\` |"
            echo "| Previous Worker Version ID (rollback target) | \`$PREVIOUS_VERSION_ID\` |"
            echo "| Deployed SHA | \`$DEPLOYED_SHA\` |"
            echo "| Rollout percentage | \`${{ inputs.rollout_percentage }}%\` |"
            echo "| Deployed version-spec(s) | \`$ROLLOUT_DEPLOY_SPECS\` |"
            echo "| Staging provenance run | \`${{ steps.provenance.outputs.staging_provenance_run }}\` |"
            echo "| BASE_PRODUCTION_SHA | \`${{ steps.policy_gate.outputs.base_production_sha }}\` |"
            echo "| FINAL_RISK | \`${{ steps.policy_gate.outputs.final_risk }}\` |"
            echo "| Workflow run ID | \`${{ github.run_id }}\` |"
            echo "| Deployed at (UTC) | \`$DEPLOYED_AT\` |"
            echo ""
            echo "Rollback command, if ever needed:"
            echo '```'
            echo "npx wrangler versions deploy \"$PREVIOUS_VERSION_ID@100\" --config dist/server/wrangler.json --yes"
            echo '```'
            echo ""
            echo "Append a row to \`docs/release/PRODUCTION_DEPLOYMENT_MANIFEST.md\` recording this release (SHA, both version ids, rollout percentage, run ID, timestamp, FINAL_RISK, smoke result below) — this workflow does not write to the repository itself."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production release evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-release-evidence-${{ github.run_id }}
          path: ${{ env.EVIDENCE_FILE }}
          retention-days: 365

      # Mandatory, blocking, read-only HTTP smoke suite against the real
      # production hostname (never *.workers.dev). No request submits an RFQ
      # (S7 verifies form presence and required fields only) and no request
      # requires a credential beyond a plain GET. Any 5xx, or any check
      # below failing its criterion, fails this job. There is no automatic
      # rollback on failure — the exact rollback command is already printed
      # above with PREVIOUS_VERSION_ID filled in; a human decides
      # (docs/release/PRODUCTION_DEPLOY_WORKFLOW_DESIGN.md §9).
      - name: Production smoke checks (S1-S10, fa/en/ar locale coverage)
        run: |
          set -uo pipefail
          BASE_URL="https://www.ahanassa.com"
          APEX_URL="https://ahanassa.com"
          SMOKE_DIR="$RUNNER_TEMP/smoke"
          mkdir -p "$SMOKE_DIR"
          FAILURES=0
          CHECKS_PASSED=0

          fail() {
            echo "::error::SMOKE CHECK FAILED — $1"
            FAILURES=$((FAILURES + 1))
          }

          pass() {
            echo "  OK — $1"
            CHECKS_PASSED=$((CHECKS_PASSED + 1))
          }

          http_status() {
            curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$1"
          }

          redirect_target() {
            curl -s -o /dev/null -w '%{redirect_url}' --max-time 20 "$1"
          }

          # Writes the response body straight to a file and prints that
          # file's path — deliberately never returned as a shell variable.
          # A response body here can be tens of KB of localized HTML;
          # grepping it from a file (a real, seekable fd) rather than piping
          # a giant shell variable through grep is the more robust form
          # regardless of platform, and is what every check below does.
          body_to_file() {
            local out="$SMOKE_DIR/$2"
            curl -s --max-time 20 "$1" > "$out"
            echo "$out"
          }

          # AUDIT FIX (docs/release/PRODUCTION_WORKFLOW_INDEPENDENT_AUDIT.md
          # MEDIUM finding): S5/S6/S7 previously checked only the default
          # (fa) locale. This maps each supported locale to its URL prefix
          # (fa is unprefixed, per PROJECT_OVERRIDES.md §1) and its own
          # localized "catalog is being prepared" empty-state string
          # (components/products/catalog-empty-state.tsx), so the catalog
          # index/detail and RFQ checks below can loop over fa/en/ar without
          # duplicating per-locale logic three times.
          declare -A LOCALE_PREFIX=( [fa]="" [en]="/en" [ar]="/ar" )
          declare -A LOCALE_EMPTY_STATE=(
            [fa]="کاتالوگ آنلاین در حال آماده‌سازی است"
            [en]="The online catalog is being prepared"
            [ar]="الكتالوج الإلكتروني قيد الإعداد"
          )
          declare -A CATALOG_SLUG

          echo "== S1: homepage / =="
          STATUS="$(http_status "$BASE_URL/")"
          BODY_FILE="$(body_to_file "$BASE_URL/" "s1-home.html")"
          if [ "$STATUS" = "200" ] && grep -qi '<html[^>]*lang="fa"[^>]*dir="rtl"' "$BODY_FILE"; then
            pass "/ -> 200, <html lang=\"fa\" dir=\"rtl\">"
          else
            fail "/ expected 200 with <html lang=\"fa\" dir=\"rtl\">, got status $STATUS"
          fi

          echo "== S1b: homepage /ar =="
          STATUS="$(http_status "$BASE_URL/ar")"
          BODY_FILE="$(body_to_file "$BASE_URL/ar" "s1b-home-ar.html")"
          if [ "$STATUS" = "200" ] && grep -qi '<html[^>]*lang="ar"[^>]*dir="rtl"' "$BODY_FILE"; then
            pass "/ar -> 200, <html lang=\"ar\" dir=\"rtl\">"
          else
            fail "/ar expected 200 with <html lang=\"ar\" dir=\"rtl\">, got status $STATUS"
          fi

          echo "== S2: /fa redirects to the unprefixed default locale =="
          STATUS="$(http_status "$BASE_URL/fa")"
          TARGET="$(redirect_target "$BASE_URL/fa")"
          if [ "$STATUS" = "308" ] && [ "$TARGET" = "$BASE_URL/" ]; then
            pass "/fa -> 308 -> /"
          else
            fail "/fa expected 308 -> $BASE_URL/, got $STATUS -> $TARGET"
          fi

          echo "== S3: /en =="
          STATUS="$(http_status "$BASE_URL/en")"
          BODY_FILE="$(body_to_file "$BASE_URL/en" "s3-en.html")"
          if [ "$STATUS" = "200" ] && grep -qi '<html[^>]*lang="en"[^>]*dir="ltr"' "$BODY_FILE"; then
            pass "/en -> 200, <html lang=\"en\" dir=\"ltr\">"
          else
            fail "/en expected 200 with <html lang=\"en\" dir=\"ltr\">, got status $STATUS"
          fi

          echo "== S4: /services, /en/services, /ar/services =="
          for p in "/services" "/en/services" "/ar/services"; do
            STATUS="$(http_status "$BASE_URL$p")"
            if [ "$STATUS" = "200" ]; then pass "$p -> 200"; else fail "$p expected 200, got $STATUS"; fi
          done

          echo "== S5: catalog index (fa/en/ar) =="
          for LOC in fa en ar; do
            PREFIX="${LOCALE_PREFIX[$LOC]}"
            URL="$BASE_URL$PREFIX/products"
            STATUS="$(http_status "$URL")"
            PRODUCTS_BODY_FILE="$(body_to_file "$URL" "s5-products-$LOC.html")"
            # A locale whose catalog is legitimately empty is a DOCUMENTED,
            # supported state, never a failure: fa/en/ar publish completely
            # independently of one another (docs/CATALOG_EDITORIAL_PUBLICATION.md
            # §6 — "FA, EN, AR are independent per (entity, locale) rows —
            # publishing FA never requires EN/AR to exist, and vice versa"),
            # so `grep` finding no product link MUST fall through to the
            # empty-catalog branch below.
            #
            # It previously did not. GitHub runs every `run:` block under
            # `shell: /usr/bin/bash -e {0}`, and the `set -uo pipefail` at the
            # top of this step does NOT clear that inherited errexit — so
            # `grep`'s exit 1 ("no match") aborted this entire step mid-suite,
            # before the branch written for exactly this case could execute.
            # That is the defect that failed the first real production release
            # (run 35533626395) on production's legitimately empty `en`
            # catalog, after the fa iteration had already passed:
            # docs/release/PRODUCTION_CANARY_SMOKE_GATE_FIX_REPORT.md.
            #
            # The former `| head -n1` is also gone, removing a second,
            # still-latent instance of the same class of bug: under
            # `pipefail`, `grep ... | head -n1` reports 141 (SIGPIPE) whenever
            # the match list is large enough that `head` exits while `grep` is
            # still writing — which would abort this step on a POPULATED
            # catalog once the fa catalog outgrows the pipe buffer. The first
            # match is now selected with parameter expansion instead (below).
            #
            # Fail-closed is preserved exactly: only status 1 ("no match") is
            # tolerated. Any other grep status is a real harness error and
            # still fails the gate, rather than being silently read as "this
            # locale has an empty catalog."
            SLUG=""
            SLUG_HREF=""
            GREP_STATUS=0
            SLUG_HREF="$(grep -o "href=\"$PREFIX/products/[a-zA-Z0-9_-]\+\"" "$PRODUCTS_BODY_FILE")" || GREP_STATUS=$?
            if [ "$GREP_STATUS" -gt 1 ]; then
              echo "::error::SMOKE HARNESS ERROR — scanning $PRODUCTS_BODY_FILE for a [$LOC] catalog link failed with grep status $GREP_STATUS, which is not a 'no match'. Failing closed rather than reporting an unverified catalog as empty."
              exit 1
            fi
            # Take the FIRST match only. Done with parameter expansion rather than
            # `| head -n1`: `head` exiting early can hand `grep` a SIGPIPE, which
            # `pipefail` then reports as 141 and errexit acts on — the same class
            # of abort this whole fix exists to remove, just triggered by a LARGE
            # catalog instead of an empty one. `grep -m1` is NOT a substitute:
            # it stops after the first matching LINE, and a minified page puts
            # every product link on one line, so `grep -o -m1` still emits every
            # match and SLUG would become a multi-line value.
            SLUG_HREF="${SLUG_HREF%%$'\n'*}"
            if [ -n "$SLUG_HREF" ]; then
              SLUG="$(printf '%s' "$SLUG_HREF" | sed -E "s#href=\"$PREFIX/products/([a-zA-Z0-9_-]+)\"#\1#")"
            fi
            CATALOG_SLUG[$LOC]="$SLUG"
            if [ "$STATUS" != "200" ]; then
              fail "$PREFIX/products [$LOC] expected 200, got $STATUS"
            elif [ -n "$SLUG" ]; then
              pass "$PREFIX/products [$LOC] -> 200, discovered a published catalog slug"
            elif grep -q "${LOCALE_EMPTY_STATE[$LOC]}" "$PRODUCTS_BODY_FILE"; then
              pass "$PREFIX/products [$LOC] -> 200, legitimate empty-catalog state"
            else
              fail "$PREFIX/products [$LOC] returned 200 but neither a product link nor the known empty-catalog state was found"
            fi
          done

          echo "== S6: catalog detail (fa/en/ar) =="
          for LOC in fa en ar; do
            PREFIX="${LOCALE_PREFIX[$LOC]}"
            SLUG="${CATALOG_SLUG[$LOC]}"
            if [ -n "$SLUG" ]; then
              URL="$BASE_URL$PREFIX/products/$SLUG"
              STATUS="$(http_status "$URL")"
              DETAIL_BODY_FILE="$(body_to_file "$URL" "s6-detail-$LOC.html")"
              if [ "$STATUS" = "200" ] && grep -q '<h1' "$DETAIL_BODY_FILE"; then
                pass "$PREFIX/products/$SLUG [$LOC] -> 200, <h1> present"
              else
                fail "$PREFIX/products/$SLUG [$LOC] expected 200 with an <h1>, got status $STATUS"
              fi
            else
              URL="$BASE_URL$PREFIX/products/smoke-check-no-such-slug"
              STATUS="$(http_status "$URL")"
              if [ "$STATUS" = "404" ]; then
                pass "no published catalog slug for [$LOC]; $PREFIX/products/<nonexistent> correctly 404s"
              else
                fail "$PREFIX/products/<nonexistent> [$LOC] expected 404 with an empty catalog, got $STATUS"
              fi
            fi
          done

          echo "== S7: RFQ page render (fa/en/ar) — no RFQ submitted =="
          for LOC in fa en ar; do
            PREFIX="${LOCALE_PREFIX[$LOC]}"
            URL="$BASE_URL$PREFIX/contact"
            STATUS="$(http_status "$URL")"
            CONTACT_BODY_FILE="$(body_to_file "$URL" "s7-contact-$LOC.html")"
            if [ "$STATUS" != "200" ]; then
              fail "$PREFIX/contact [$LOC] expected 200, got $STATUS"
            elif grep -q '<form' "$CONTACT_BODY_FILE" \
              && grep -q 'name="company"' "$CONTACT_BODY_FILE" \
              && grep -q 'name="phoneCountry"' "$CONTACT_BODY_FILE" \
              && grep -q 'name="phoneLocal"' "$CONTACT_BODY_FILE" \
              && grep -qi 'challenges\.cloudflare\.com/turnstile' "$CONTACT_BODY_FILE"; then
              pass "$PREFIX/contact [$LOC] -> 200, <form> with company/phoneCountry/phoneLocal fields and Turnstile widget markup present (no RFQ submitted)"
            else
              fail "$PREFIX/contact [$LOC] returned 200 but the RFQ form/Turnstile markup was not found in the rendered HTML"
            fi
          done

          echo "== S8: not-found handling =="
          STATUS="$(http_status "$BASE_URL/products/smoke-check-route-that-does-not-exist")"
          if [ "$STATUS" = "404" ]; then
            pass "unknown catalog route -> 404 (not 500)"
          else
            fail "unknown catalog route expected 404, got $STATUS"
          fi

          echo "== S9: security headers =="
          HEADERS_FILE="$SMOKE_DIR/s9-headers.txt"
          curl -s -D - -o /dev/null --max-time 20 "$BASE_URL/" | tr -d '\r' > "$HEADERS_FILE"
          for h in "x-content-type-options: nosniff" "x-frame-options: DENY" "referrer-policy: strict-origin-when-cross-origin"; do
            if grep -qi "^${h}$" "$HEADERS_FILE"; then
              pass "header present: $h"
            else
              fail "missing/incorrect security header: $h"
            fi
          done
          if grep -qi "^permissions-policy:" "$HEADERS_FILE"; then
            pass "header present: permissions-policy"
          else
            fail "missing permissions-policy header"
          fi
          if grep -qi "^content-security-policy" "$HEADERS_FILE"; then
            pass "header present: content-security-policy (report-only or enforced)"
          else
            fail "missing content-security-policy header"
          fi

          echo "== S10: apex redirect =="
          STATUS="$(http_status "$APEX_URL/")"
          TARGET="$(redirect_target "$APEX_URL/")"
          if [ "$STATUS" = "308" ] && [ "$TARGET" = "$BASE_URL/" ]; then
            pass "apex -> 308 -> $BASE_URL/"
          else
            fail "apex expected 308 -> $BASE_URL/, got $STATUS -> $TARGET"
          fi

          echo ""
          TOTAL_CHECKS=$((CHECKS_PASSED + FAILURES))
          if [ "$FAILURES" -gt 0 ]; then
            SMOKE_RESULT="FAILED ($FAILURES check(s), $CHECKS_PASSED/$TOTAL_CHECKS passed)"
          else
            SMOKE_RESULT="PASSED ($CHECKS_PASSED/$TOTAL_CHECKS)"
          fi
          echo "smoke_result=$SMOKE_RESULT" >> "$GITHUB_ENV"

          {
            echo ""
            echo "### Production smoke checks"
            echo ""
            echo "**$SMOKE_RESULT**"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAILURES" -gt 0 ]; then
            echo "::error::$FAILURES production smoke check(s) failed. Traffic has ALREADY shifted to $NEW_VERSION_ID — this does not undo that. No automatic rollback is performed."
            echo "::error::Rollback command (review before running): npx wrangler versions deploy \"$PREVIOUS_VERSION_ID@100\" --config dist/server/wrangler.json --yes"
            {
              echo ""
              echo "Rollback command (review before running):"
              echo '```'
              echo "npx wrangler versions deploy \"$PREVIOUS_VERSION_ID@100\" --config dist/server/wrangler.json --yes"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All production smoke checks passed."

      # RELEASE POLICY AUDIT RECORD (RELEASE_POLICY.md §15) — runs on every
      # outcome, including a run the policy gate blocked or one that failed
      # before the gate. Read-only: it only combines the gate's decision
      # with what happened afterwards into the job summary and a durable
      # artifact. It shifts no traffic and writes nothing to the repository.
      - name: Release policy audit record (always)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          STAGING_RUN: ${{ steps.provenance.outputs.staging_provenance_run }}
          CANDIDATE_INPUT: ${{ inputs.deploy_ref }}
          DECLARED_RISK_INPUT: ${{ inputs.declared_risk }}
          ROLLOUT_INPUT: ${{ inputs.rollout_percentage }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -uo pipefail
          DECISION_FILE="$RUNNER_TEMP/release-policy-decision.json"
          AUDIT_FILE="$RUNNER_TEMP/release-policy-audit.json"
          if [ -s "$DECISION_FILE" ]; then
            cp "$DECISION_FILE" "$AUDIT_FILE.base"
          else
            jq -n --arg c "$CANDIDATE_INPUT" --arg d "$DECLARED_RISK_INPUT" --arg r "$ROLLOUT_INPUT" '{
              OPERATION_TYPE: "RELEASE", RESULT: "BLOCKED", BLOCK_CODE: "FAILED_BEFORE_POLICY_GATE",
              BLOCK_REASONS: ["the run stopped before the release policy gate produced a decision"],
              BASE_PRODUCTION_SHA: null, CANDIDATE_SHA: $c, DECLARED_RISK: null, DECLARED_RISK_INPUT: $d,
              COMPUTED_MINIMUM_RISK: null, FINAL_RISK: null, CLASSIFICATION_RESULT: "NOT_EVALUATED",
              TRIGGERED_RISK_RULES: [], CHANGED_FILES: [], ROLLOUT_PERCENTAGE: $r, EXPECTED_RELEASE_PATH: null
            }' > "$AUDIT_FILE.base"
          fi
          GATE_RESULT="$(jq -r '.RESULT' "$AUDIT_FILE.base")"
          if [ "$(jq -r '.BLOCK_CODE' "$AUDIT_FILE.base")" = "FAILED_BEFORE_POLICY_GATE" ]; then
            RESULT="FAIL (stopped before the release policy gate; job status: $JOB_STATUS)"
          elif [ "$GATE_RESULT" != "PERMITTED" ]; then
            RESULT="BLOCKED_BY_POLICY: $(jq -r '.BLOCK_CODE' "$AUDIT_FILE.base")"
          elif [ "$JOB_STATUS" = "success" ]; then
            RESULT="PASS"
          else
            RESULT="FAIL (job status: $JOB_STATUS)"
          fi
          jq --arg gate "$GATE_RESULT" --arg result "$RESULT" --arg staging "${STAGING_RUN:-NOT_REACHED}" \
             --arg smoke "${smoke_result:-NOT_REACHED}" --arg newv "${NEW_VERSION_ID:-NONE}" \
             --arg run "$RUN_ID" --arg attempt "$RUN_ATTEMPT" \
            '. + {GATE_RESULT: $gate, RESULT: $result, STAGING_PROVENANCE_RUN_ID: $staging, SMOKE_RESULT: $smoke,
                  NEW_VERSION_ID: $newv, PRODUCTION_RUN_ID: $run, PRODUCTION_RUN_ATTEMPT: $attempt}' \
            "$AUDIT_FILE.base" > "$AUDIT_FILE"
          rm -f "$AUDIT_FILE.base"
          {
            echo ""
            echo "### Release policy audit record"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            jq -r '
              ["OPERATION_TYPE","BASE_PRODUCTION_SHA","CANDIDATE_SHA","DECLARED_RISK","COMPUTED_MINIMUM_RISK","FINAL_RISK",
               "CLASSIFICATION_RESULT","STAGING_PROVENANCE_RUN_ID","EXPECTED_RELEASE_PATH","GATE_RESULT","RESULT"] as $keys
              | . as $d | $keys[] | "| \(.) | `\($d[.] // "-")` |"' "$AUDIT_FILE"
            echo "| TRIGGERED_RISK_RULES | \`$(jq -r '.TRIGGERED_RISK_RULES | join(", ")' "$AUDIT_FILE")\` |"
            echo "| CHANGED_FILES | $(jq -r '.CHANGED_FILES | length' "$AUDIT_FILE") (full list in the release-policy-audit artifact) |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Release policy audit record: $RESULT"

      - name: Upload release policy audit record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-policy-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/release-policy-audit.json
          if-no-files-found: error
          retention-days: 365
