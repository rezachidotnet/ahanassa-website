# Architecture V1.1 §15 + r3 (exceededCpu / 1102 alert) — ops health checks, STAGING (W6).
#
# Every 15 min: cron liveness of the v11 RFQ Worker, undelivered / terminal-failure RFQs (DB_OPS, counts
# only), exceededCpu/1102 + cron cpuTime, intake 5xx/400/422, age of the last successful content publish,
# Odoo GET /api/v1/catalog/meta. Writes a job summary table and FAILS the job only on ALERT, with one
# "ALERT: <check>" annotation per alert — GitHub then e-mails the failed run (docs/OPS_ALERTS.md).
# Alerting never depends on what it watches: no Worker cron/Queue; read-only Cloudflare token; no writes.
# W6.1: also dispatched every 15 min by the Odoo-server timer ahanassa-ops-dispatch (GitHub `schedule` is
# best-effort; it stays as a second path), and pings healthchecks.io so a run that never happens alerts too.
#
# BRANCH NOTE (until cutover): this file lives on `main` only so GitHub will schedule/dispatch it
# (CLAUDE.md §5b). main and the application branch have unrelated histories, so the job checks out
# feat/v11-static-site for scripts/ops/health/*. At cutover, change `ref` to the real application branch.
#
# W8.0: a second job, `health-production`, checks production (OPS_TARGETS.production; live on www.ahanassa.com
# and api.ahanassa.com since the W8.1 cutover): RFQ cron liveness, RFQ Worker CPU/1102, production DB_OPS, intake,
# the last production content publish, and Odoo. W9.1: the stale-content check ALERTs only while the GitHub variable
# OPS_PRODUCTION_CONTENT_STALE_ALERT is "on" (the owner sets it after the first 08:00 UTC CONTENT_REBUILD AUTO
# publish); unset = report only. Only runs whose publish job actually finalized count (scripts/ops/health).
# It runs in environment production-v11-monitor (no reviewer, branch main, read-only monitor token only) —
# not production-v11, whose reviewer gate would hold every 15-min run. Until that environment has the
# monitor token it skips with a notice. It never exposes `test_force_alert` (staging-only).
#
# W11.2: a third job, `content watchdog (production)`: from 09:00 UTC (12:30 Tehran) of the Tehran day, when Odoo has
# approved prices that are not live on www 45 min after they were published, it dispatches daily-content.yml once for
# those prices (source=watchdog) and ALERTs on every run until they are live (.github/scripts/v11-daily-content.mjs).
# It is its own job, not a step of health-production: v11-release-watch.yml reads health-production's outcome as the
# release observation (unpublished prices must not roll a LOW release back), and it needs no environment (no
# environment wait can hold it). ALERT = failed job (GitHub e-mail) + healthchecks.io: HC_PING_DAILY_CONTENT (its own
# check; also a dead-man's switch for the watchdog) when set, otherwise a /fail ping to HC_PING_OPS_HEALTH_PRODUCTION.

# W30: a fourth job, `iran-copy`, compares the domestic copy (iransrv behind ArvanCloud) with the host it mirrors —
# the domestic-copy incident class (RELEASE_POLICY.md §20.2b draft), never a release ALERT. Off until IRAN_COPY_CHECK=on.

name: Ops health

on:
  workflow_dispatch:
    inputs:
      test_force_alert:
        description: "STAGING TEST ONLY: force one check to ALERT with a test threshold (docs/OPS_ALERTS.md §4)"
        type: choice
        required: false
        default: none
        options: [none, cron, rfq, cpu, intake, content, odoo]
  schedule:
    # Every 15 min, off the top of the hour (GitHub schedules are best-effort; the check window
    # starts at the previous run, so a delayed run still covers the gap).
    - cron: "4,19,34,49 * * * *"

permissions:
  contents: read
  actions: read
  # W17.3: "Odoo unreachable" ALERTs only on the 2nd failed check in a row; the count is read back from the previous
  # completed run's annotations (GET /check-runs/{job_id}/annotations). Read-only.
  checks: read

# W11.3: no concurrency group at all (W9.1c had one per job). GitHub sometimes never moves a job out of "waiting" on an
# environment that has no reviewer or wait timer (F3: staging 2026-10-06 and 10-07; production-v11-monitor run
# 38093742621, 2026-10-10 23:04 UTC). With a group, that one stuck job held the group: every later production job
# queued "pending" behind it and was cancelled 15 min later by the next run (one pending job per group), so production
# monitoring and its dead-man's ping stopped for 15 h. Without a group a stuck job only loses its own run. Overlap is
# harmless: the checks are read-only, each job has a 10 min timeout, and a run's window starts at the previous
# COMPLETED run (scripts/ops/health), so a stuck run is never taken as the start of a window.
jobs:
  health:
    name: health (staging)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Checkout scripts/ops (application branch)
        uses: actions/checkout@v6
        with:
          ref: feat/v11-static-site
          sparse-checkout: scripts/ops

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Health checks (fails only on ALERT)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V11_STAGING_CLOUDFLARE_MONITOR_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.V11_STAGING_CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          # STAGING TEST ONLY (W6 alert test). Ignored on schedule; refused for production by the script.
          OPS_HEALTH_TEST_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_force_alert || 'none' }}
        run: |
          set -euo pipefail
          node scripts/ops/health/run.ts --env staging

      # W6.1 dead-man's switch: healthchecks.io alerts when this ping does NOT arrive (a run that never
      # happened). Always runs; failure pings /fail. Never fails the job; a missing secret is skipped.
      - name: Dead-man's switch ping (healthchecks.io)
        if: ${{ always() }}
        shell: bash
        env:
          HC_URL: ${{ secrets.HC_PING_OPS_HEALTH }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ -z "$HC_URL" ]; then
            echo "::notice title=healthchecks ping skipped::HC_PING_OPS_HEALTH is not set"
            exit 0
          fi
          url="$HC_URL"
          if [ "$JOB_STATUS" != "success" ]; then url="$HC_URL/fail"; fi
          # URL passed as a curl config on stdin (it is a secret; not in argv).
          if printf 'url = "%s"\n' "$url" | curl -fsS -K - -o /dev/null --max-time 10 --retry 2; then
            echo "healthchecks ping sent ($([ "$JOB_STATUS" = success ] && echo success || echo fail))"
          else
            echo "::warning title=healthchecks ping failed::could not reach healthchecks.io"
          fi

  health-production:
    name: health (production-prep)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production-v11-monitor
    steps:
      - name: Checkout scripts/ops (application branch)
        uses: actions/checkout@v6
        with:
          ref: feat/v11-static-site
          sparse-checkout: scripts/ops

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Health checks, production-prep (fails only on ALERT)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V11_PRODUCTION_CLOUDFLARE_MONITOR_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.V11_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          # W9.1: "on" turns the production stale-content ALERT on (owner: gh variable set OPS_PRODUCTION_CONTENT_STALE_ALERT --body on).
          OPS_PRODUCTION_CONTENT_STALE_ALERT: ${{ vars.OPS_PRODUCTION_CONTENT_STALE_ALERT }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=production health skipped::V11_PRODUCTION_CLOUDFLARE_MONITOR_TOKEN / _ACCOUNT_ID are not set in environment production-v11-monitor"
            exit 0
          fi
          node scripts/ops/health/run.ts --env production

      # W9.1c: production's own dead-man's switch (a separate healthchecks.io check from the staging one, so a stuck
      # staging job cannot hide a silent production monitor, nor the reverse). Same behaviour as the staging ping.
      - name: Dead-man's switch ping (healthchecks.io, production)
        if: ${{ always() }}
        shell: bash
        env:
          HC_URL: ${{ secrets.HC_PING_OPS_HEALTH_PRODUCTION }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ -z "$HC_URL" ]; then
            echo "::notice title=healthchecks ping skipped::HC_PING_OPS_HEALTH_PRODUCTION is not set"
            exit 0
          fi
          url="$HC_URL"
          if [ "$JOB_STATUS" != "success" ]; then url="$HC_URL/fail"; fi
          # URL passed as a curl config on stdin (it is a secret; not in argv).
          if printf 'url = "%s"\n' "$url" | curl -fsS -K - -o /dev/null --max-time 10 --retry 2; then
            echo "healthchecks ping sent ($([ "$JOB_STATUS" = success ] && echo success || echo fail))"
          else
            echo "::warning title=healthchecks ping failed::could not reach healthchecks.io"
          fi

  daily-content-watchdog:
    name: content watchdog (production)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Reads the production publish state; dispatches daily-content.yml.
      actions: write
    concurrency:
      group: ops-health-daily-content-watchdog
      cancel-in-progress: false
    steps:
      - name: Checkout the release scripts
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: "Newer Odoo prices live on www? (from 09:00 UTC; fails only on ALERT; dispatches daily-content once per price update)"
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node .github/scripts/v11-daily-content.mjs watchdog

      - name: healthchecks.io (daily content)
        if: ${{ always() }}
        shell: bash
        env:
          HC_URL: ${{ secrets.HC_PING_DAILY_CONTENT }}
          HC_FALLBACK: ${{ secrets.HC_PING_OPS_HEALTH_PRODUCTION }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ -n "$HC_URL" ]; then
            url="$HC_URL"
            if [ "$JOB_STATUS" != "success" ]; then url="$HC_URL/fail"; fi
          elif [ "$JOB_STATUS" != "success" ] && [ -n "$HC_FALLBACK" ]; then
            # No own check: the ALERT goes to the production check as /fail only (never a success ping there).
            url="$HC_FALLBACK/fail"
          else
            echo "healthchecks ping not needed (job $JOB_STATUS; HC_PING_DAILY_CONTENT not set)"
            exit 0
          fi
          # URL passed as a curl config on stdin (it is a secret; not in argv).
          if printf 'url = "%s"\n' "$url" | curl -fsS -K - -o /dev/null --max-time 10 --retry 2; then
            echo "healthchecks ping sent ($([ "$JOB_STATUS" = success ] && echo success || echo fail))"
          else
            echo "::warning title=healthchecks ping failed::could not reach healthchecks.io"
          fi

  # W30 (W29 P1 §1.6; RELEASE_POLICY.md §20.2b draft): the domestic copy (iransrv behind ArvanCloud) vs the Cloudflare
  # host it mirrors. Its OWN job, by design: v11-release-watch.yml reads only `health (production-prep)` (a run whose
  # only failure is this job counts as a passing run there), so IR_COPY_DRIFT / IR_UNREACHABLE e-mail the owner (failed
  # run) but never roll a release back and never block a STABLE_100 row. Public reads only; no environment, no secret.
  # Off until the owner sets the repository variable IRAN_COPY_CHECK=on (after deploy/iran/RUNBOOK_P1.md §5).
  iran-copy:
    name: iran-copy (domestic copy; not a release check, §20.2b)
    if: ${{ vars.IRAN_COPY_CHECK == 'on' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout the release scripts (this workflow's own commit on main)
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      # The drift clock: when www switched to the snapshot it serves (the newest v11-live-release record).
      - name: www's newest production publish record
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=v11-live-release&per_page=1" --jq '.artifacts[0].id')
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/live.zip"
          unzip -p "$RUNNER_TEMP/live.zip" live-release.json > "$RUNNER_TEMP/live-release.json"

      - name: Drift + reachability (fails only on IR_COPY_DRIFT / IR_UNREACHABLE)
        shell: bash
        env:
          # source=copy pairs; IRAN_COPY_PAIRS overrides (e.g. + https://www.ahanassa.com=https://www.ahanassa.ir after the
          # LATER Arvan origin switch, RUNBOOK_P1.md §10).
          PAIRS: ${{ vars.IRAN_COPY_PAIRS || 'https://www.ahanassa.com=https://new.ahanassa.ir https://ahanassa-v11-static-staging.nova-b1e6f0.workers.dev=https://staging.ahanassa.ir' }}
        run: |
          set -euo pipefail
          node .github/scripts/v11-iran-copy.mjs check --pairs "$PAIRS" --live-release "$RUNNER_TEMP/live-release.json"

