# W11.2 (owner requirement 2026-10-11) — the daily production content publish must never be silently skipped.
#
# The entry point of the daily content publish. It never builds or writes anything itself: it reads the production
# publish state (v11-live-release records) and, only when today's (Tehran date) content publish has not succeeded yet
# and none is under way, dispatches content-publish.yml target=daily-content — which builds the code LIVE on
# www.ahanassa.com and publishes on CONTENT_REBUILD AUTO only (environment production-v11-content, no approval).
# At most one AUTO publish per Tehran day; a no-op takes ~20 s and never touches content-publish's concurrency slot.
#
# Ways in (all share the guard; .github/scripts/v11-daily-content.mjs):
#   - schedule 08:00 / 08:20 / 08:40 UTC (11:30 / 11:50 / 12:10 Tehran): GitHub drops many scheduled events on this
#     repository, so each is a backup of the one before;
#   - Odoo, right after the owner publishes prices: POST /repos/rezachidotnet/ahanassa-website/actions/workflows/
#     daily-content.yml/dispatches {"ref":"main","inputs":{"source":"odoo"}} with a fine-grained token (Actions:
#     read and write on this repository only). repository_dispatch (event_type daily-content) is accepted too, but
#     needs a token with Contents: write — use workflow_dispatch;
#   - ops-health.yml job `daily-content watchdog`: at/after 09:00 UTC with no publish today it dispatches this
#     workflow once (source=watchdog) and ALERTs.
name: Daily content

run-name: "daily-content (${{ inputs.source || (github.event_name == 'repository_dispatch' && 'repository-dispatch') || github.event_name }})"

on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "20 8 * * *"
    - cron: "40 8 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Who asks (odoo, watchdog, manual): shown in the run name"
        type: string
        required: false
        default: manual
  repository_dispatch:
    types: [daily-content]

permissions:
  contents: read
  # Reads the publish state and content-publish runs; dispatches content-publish.yml.
  actions: write

# One entry decision at a time: the second sees the content-publish run the first dispatched.
concurrency:
  group: daily-content
  cancel-in-progress: false

jobs:
  entry:
    name: daily content (guard, then dispatch when needed)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout the release scripts
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: "Today's content publish: no-op when done or under way, else dispatch content-publish target=daily-content"
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source || (github.event_name == 'repository_dispatch' && 'repository-dispatch') || github.event_name }}
        run: |
          set -euo pipefail
          node .github/scripts/v11-daily-content.mjs entry --source "$SOURCE"
